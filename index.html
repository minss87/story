<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이야기 공방">
<meta name="theme-color" content="#F7F7F5" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 미니멀 · 옛 메모장 종이결 · 세이지 그린 윤곽 · 서재 중심(탭 없음) */
:root{
  --bg:#F7F7F5; --ink:#141619; --ink2:#4A4F55; --ink3:#858B91; --line:#E2E2DE;
  --accent:#2C6A5C; --fill:#EEEEEB; --sheet:#F9F9F7; --danger:#B3413A;
  --grain:.5; --blend:normal;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --serif:"Noto Serif KR","AppleMyungjo","Batang",serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121416; --ink:#ECEEEF; --ink2:#B2B7BB; --ink3:#7B8287; --line:#25292C;
  --accent:#84C6B4; --fill:#1A1D20; --sheet:#16191B; --danger:#E58A82;
  --grain:.3; --blend:screen; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:var(--grain);mix-blend-mode:var(--blend);background:url(paper.png) 0 0/256px 256px repeat}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
.serif{font-family:var(--serif)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 0;min-height:64px;flex:none;gap:12px}
.h1{font-size:26px;font-weight:700;letter-spacing:-.6px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px 24px}
.icon{width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);border-radius:20px}
.icon svg{width:22px;height:22px}
.scroll{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:16px;margin-left:-8px;padding:8px 8px 8px 0}
.back svg{width:22px;height:22px}
.headlinks{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:15px}
.headlinks .tl{padding:8px 6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-top:8px}
.row .sub{display:block;font-size:13px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lft{min-width:0;flex:1}
.memo-name{width:100%;border:0;background:transparent;outline:none;font-family:var(--serif);font-size:24px;font-weight:700;margin-top:8px;padding:4px 0}
.memo-name::placeholder{color:var(--ink3)}
.memo{width:100%;border:0;background:transparent;outline:none;resize:none;font-size:16px;line-height:1.95;margin-top:12px;min-height:60vh;word-break:keep-all}
.memo::placeholder{color:var(--ink3)}

.texttabs{display:flex;gap:20px;font-size:15px;color:var(--ink3);flex-wrap:wrap;row-gap:12px}
.texttabs button{padding:4px 0;position:relative}
.texttabs button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.texttabs button[aria-pressed="true"]:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:var(--accent);border-radius:1px}

.workpick{display:flex;align-items:center;gap:2px;font-size:14.5px;color:var(--ink2);max-width:55%}
.workpick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workpick svg{width:16px;height:16px;flex:none}

.tpl{margin-top:30px;font-family:var(--serif);font-size:18px;line-height:2.2;word-break:keep-all;color:var(--ink)}
.blank{color:var(--accent);border-bottom:2px solid var(--accent);padding:0 2px;outline:none;font-weight:700;min-width:2.5em;display:inline}
.blank:empty:before{content:attr(data-ph);color:var(--ink3);font-weight:500}
.blank:focus{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.line-input{width:100%;margin-top:28px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0 12px;outline:none;font-size:16px}
.line-input::placeholder{color:var(--ink3)}
.line-input:focus{border-bottom-color:var(--accent)}
select.line-input{appearance:none;-webkit-appearance:none}
.words{display:flex;align-items:baseline;gap:8px;margin-top:26px;font-size:15px;color:var(--ink3)}
.words input{width:5.5em;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0 6px;text-align:right;font-weight:700;color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.words input:focus{border-bottom-color:var(--accent)}

.cta-wrap{display:flex;justify-content:center;padding:14px 24px calc(18px + env(safe-area-inset-bottom,0px));flex:none}
.cta{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 26px;border-radius:24px;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:16.5px}
.cta svg{width:17px;height:17px}
.cta:disabled{opacity:.4}
.cta:active{background:color-mix(in srgb,var(--accent) 10%,transparent)}

.cap{font-size:13px;color:var(--ink2);font-weight:700;margin:32px 0 2px;display:flex;justify-content:space-between;align-items:center}
.cap button{color:var(--ink3);font-weight:500;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:17px 0;border-bottom:1px solid var(--line);font-size:16.5px;text-align:left}
.row .val{color:var(--ink3);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:13em}
.row svg{width:17px;height:17px;color:var(--ink3);flex:none}
.dot{width:7px;height:7px;border-radius:4px;background:var(--accent);display:inline-block}
.dot.off{background:var(--ink3)}

.now{margin-top:26px;padding:20px 0 24px;border-bottom:1px solid var(--line);display:block;width:100%;text-align:left}
.now .k{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:8px}
.now .t{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:-.4px}
.prog{height:2px;background:var(--line);margin-top:14px;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.prog.done i{background:var(--ink3)}
.item{display:block;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid var(--line)}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.item .t{font-family:var(--serif);font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .w{font-size:13px;color:var(--ink2);flex:none}
.empty{padding:56px 0;text-align:center;color:var(--ink3);line-height:1.8;font-size:15px}
.empty b{color:var(--ink);display:block;font-family:var(--serif);font-size:18px;margin-bottom:6px}

/* 편집 화면 */
.field{margin-top:22px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.field input,.field textarea,.field select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;outline:none;line-height:1.7}
.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:180px;resize:vertical}
.keyin.masked{-webkit-text-security:disc}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.hint{font-size:13px;color:var(--ink3);margin-top:8px;line-height:1.6}
.textbtn{color:var(--accent);font-weight:700;font-size:15.5px;padding:8px 4px}
.danger{color:var(--danger);font-weight:700;font-size:15px;padding:18px 0;display:block}
.seg{display:flex;gap:20px;font-size:15px;color:var(--ink3)}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(5,10,14,.28);z-index:50;display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet{width:100%;background:var(--sheet);border-radius:22px 22px 0 0;padding:12px 24px calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);max-height:80%;overflow-y:auto;animation:up .22s ease}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 0;border-bottom:1px solid var(--line);font-size:16.5px;text-align:left}
.sheet .opt[aria-checked="true"]{color:var(--accent);font-weight:700}
.sheet .opt svg{width:18px;height:18px;flex:none}
svg{flex:none}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:80;max-width:86%;text-align:center;line-height:1.5}

/* 리더 */
.reader{position:fixed;inset:0;z-index:40;background:var(--rbg);color:var(--rink);--rbg:var(--bg);--rink:var(--ink);--rmut:var(--ink3);--rline:var(--line)}
.reader[data-bg="gray"]{--rbg:#E7ECEF;--rink:#13181B;--rmut:#6D777E;--rline:#CDD5DA}
.reader[data-bg="dim"]{--rbg:#1A2024;--rink:#DCE3E7;--rmut:#7A858C;--rline:#2C353B}
.reader[data-bg="black"]{--rbg:#000;--rink:#C8CED2;--rmut:#5E676D;--rline:#1C2125}
.rbox{position:absolute;left:var(--rp);right:var(--rp);top:calc(env(safe-area-inset-top,0px) + 52px);bottom:calc(env(safe-area-inset-bottom,0px) + 52px);overflow:visible}
.rflow{height:100%;column-fill:auto;font-family:var(--rfont);font-size:var(--rsize);line-height:var(--rlh);word-break:keep-all;overflow-wrap:break-word;transition:transform .28s ease;will-change:transform}
.rflow p{text-indent:1em;margin:0 0 .6em}
.rflow .ttl{text-align:center;font-weight:700;font-size:1.25em;line-height:1.5;margin:1.2em 0 1.6em;text-indent:0;break-after:avoid}
.rflow h2{text-align:center;font-size:1.1em;font-weight:700;margin:1.4em 0 1em;break-after:avoid}
.rflow .brk{text-align:center;text-indent:0;color:var(--rmut);margin:1.2em 0;letter-spacing:.6em}
.rflow .end{display:inline-block;width:1px;height:1px}
.rfoot{position:absolute;left:var(--rp);right:var(--rp);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;gap:14px;font-size:12px;color:var(--rmut);font-variant-numeric:tabular-nums}
.rfoot .prog{flex:1;margin:0;background:var(--rline)}
.rtop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 14px 8px;display:flex;justify-content:space-between;align-items:center;background:var(--rbg);color:var(--rmut);border-bottom:1px solid var(--rline);transition:opacity .2s, transform .2s;z-index:3}
.rtop .t{font-size:14px;font-weight:700;color:var(--rink);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.reader:not(.chrome) .rtop{opacity:0;transform:translateY(-8px);pointer-events:none}
.tapzone{position:absolute;inset:0;z-index:2;display:flex}
.tapzone div{height:100%}
.live{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 70px) var(--rp) 140px;font-family:var(--rfont);font-size:var(--rsize);line-height:var(--rlh);word-break:keep-all;z-index:4;background:var(--rbg)}
.live p{text-indent:1em;margin:0 0 .6em}
.live .ttl{text-align:center;font-weight:700;font-size:1.25em;margin:.6em 0 1.4em;text-indent:0}
.live .brk{text-align:center;text-indent:0;color:var(--rmut);letter-spacing:.6em}
.livebar{position:absolute;left:0;right:0;bottom:0;padding:14px 24px calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;background:linear-gradient(transparent,var(--rbg) 40%)}
.livebar .cta{border-color:var(--rmut);color:var(--rink)}
.writing{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;right:0;text-align:center;font-size:13px;color:var(--rmut);z-index:5}
.writing i{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--accent);margin-right:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.rsheet{background:var(--sheet)}
.swatches{display:flex;gap:16px;margin-bottom:26px}
.sw{width:42px;height:42px;border-radius:21px;border:1px solid var(--line)}
.sw[aria-checked="true"]{outline:2px solid var(--accent);outline-offset:3px}
.slider{display:flex;align-items:center;gap:14px;margin-top:22px;color:var(--ink2)}
.slider input{flex:1;accent-color:var(--accent)}
.slider .s{font-size:13px;width:18px;text-align:center}
.slider .l{font-size:20px;width:18px;text-align:center}
.pend{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:26px;font-size:15.5px}
.steps div{display:flex;gap:12px;align-items:baseline}
.steps b{color:var(--accent);font-variant-numeric:tabular-nums;width:14px;flex:none}
.steps .on{color:var(--ink)} .steps .off{color:var(--ink3)}
.pastebox{width:100%;margin-top:24px;min-height:200px;flex:1;border:1px solid var(--line);border-radius:14px;padding:14px;background:transparent;outline:none;font-family:var(--serif);line-height:1.8;resize:none}
.pastebox:focus{border-color:var(--accent)}
.pastebox::placeholder{color:var(--ink3);font-family:var(--sans)}
.minirow{display:flex;gap:18px;margin-top:20px;align-items:center;flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:19px;border:1.5px solid var(--line);font-size:14.5px;color:var(--ink);text-decoration:none}
.ghost svg{width:15px;height:15px}
.rsheet .acts{display:flex;justify-content:space-between;margin-top:26px;padding-top:6px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ───────── 저장소 (IndexedDB, 실패 시 localStorage) ───────── */
const DBN="iyagi-gongbang", KEY="state";
const store={
  db:null,
  async open(){ if(this.db) return this.db; return this.db=await new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}) },
  async get(){ try{const db=await this.open();return await new Promise((res,rej)=>{const t=db.transaction("kv").objectStore("kv").get(KEY);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}catch(e){try{return JSON.parse(localStorage.getItem(DBN)||"null")}catch(_){return null}} },
  async set(v){ try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){try{localStorage.setItem(DBN,JSON.stringify(v))}catch(_){toast("저장 공간이 부족해요. 설정에서 백업 후 오래된 이야기를 지워주세요.")}} }
};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const FANFIC_DEFAULT="[2차 창작 집필 지침]\n분량이 아니라 밀도로 완성하는 2차 창작 소설을 쓴다. 입체적인 글은 분량이 아니라 변화의 개수로 만들어진다.\n\n1. 설정\n- 요청과 설정집에 적힌 원작, 주연, 호칭, 말투가 항상 우선이다. 호칭과 말투(반말/존댓말)는 지정된 대로만 쓰고 임의로 바꾸지 않는다.\n- 비어 있는 항목은 원작의 성격과 관계성을 계승해 합리적으로 정한다. 되묻지 말고 바로 쓴다.\n- 이번 이야기는 완전히 새로운 플롯이어야 한다. 아래 '이전 작품'이 있으면 소재와 구조가 겹치지 않게 한다.\n\n2. 쓰기 전 설계 (설계 내용은 출력하지 않는다)\n- 중심 사건 하나를 정하고, 그것이 인물을 실제로 어떻게 바꾸는지 결말선을 먼저 잡는다.\n- 씬 목록을 만들되, 각 씬은 직전 씬과 무대·온도·감정 방향 중 최소 하나가 다르게 배치한다. (예: 질투 → 들통 → 역공 → 반전)\n- 주연 중 한 명(보통 과묵한 쪽)에게 질투·불안·오해·후회 중 하나로 속을 태우는 마음고생 라인을 반드시 준다. 겉은 무표정해도 내면이 무너지는 대비를 쓰고, 논리로 말하던 인물이라면 그 논리가 무너지는 지점(감정을 다른 이름으로 부르다 들키는 식)을 보여준다. 거짓말할 때의 버릇 같은 tell은 한두 개만 정해 남발하지 않는다.\n- 조연에게 각기 다른 기능을 준다. 사건을 굴리는 자, 온도를 올리는 자, 반전의 단서를 심는 자. 같은 역할의 조연을 중복 배치하지 않는다.\n- 소품이나 모티프 하나를 정해 발단과 결말을 묶는다. 발단이 된 사물이 마지막 회수 지점이 되게 한다.\n\n3. 서사 원칙\n- 모든 문장과 대사에 의미가 있어야 한다. 필요한 만큼만 쓰고, 필요 없어지면 끝낸다. 특정 순간을 길게 묘사하려면 그럴 가치가 있어야 한다.\n- 한 씬은 한 번만. 같은 감정 비트를 조금씩 바꿔 반복하지 않는다. 같은 대사나 같은 깨달음을 여러 조연에게 시키지 않는다.\n- 분량이 길면 그만큼 장면 전환·씬·감정 변화가 많아야 한다. 무대를 계속 바꾼다.\n- 감정은 축적되고 방향을 튼다. 위기·오해·질투는 해소되며 인물을 실제로 한 뼘 자라게 한다.\n- 지정 분량은 하한일 뿐이다. 분량이 모자라면 문장을 늘리지 말고 새로운 씬, 감정이 한 번 더 방향을 트는 지점, 조연의 새 기능으로 새 국면을 연다.\n- 중심 소재는 결말에서 회수한다.\n\n4. 장르·톤\n분위기나 요청에 아래 장르가 오면 그 특징을 따른다. 두 장르를 조합할 때는 번갈아 놓지 말고 원인과 결과로 엮는다. (예: 질투가 원인이 되어 잘못을 저지르고 → 후회로 만회)\n- 후회남주: 무심함·오해로 상처를 준 인물이 뒤늦게 깨닫고 만회한다. 사과해 본 적 없는 인물이 처음 사과하는 순간이 전환점.\n- 피폐·이별 위기: 권태·오해·자존심이 곪아 관계가 무너지기 직전까지 갔다가 밑바닥에서 되돌아온다. 무겁고 진지하게.\n- 달달·슈가러시: 갈등은 거의 없거나 가볍게, 애정 표현과 다정한 순간에 집중한다.\n- 코미디·시트콤: 작은 사건 하나가 하루 안에 사방으로 굴러가고, 끝에 감정으로 착지한다. 무대를 빠르게 바꾼다.\n- 질투·오해: 제3자의 등장으로 한쪽이 속을 태운다. 실제 위협은 없어도 마음고생이 이야기를 끈다.\n- 잔잔·힐링: 큰 사건 없이 계절과 생활의 결을 따라가며, 소품과 반복되는 일상으로 관계의 깊이를 드러낸다.\n- 판타지 한 스푼: 회귀·몸 바뀜·미래 보기처럼 설정 하나만 비틀고, 그 가정 위에서 관계를 다시 비춘다.\n- 가족 드라마: 주변 가족과 인물이 크게 개입해 웃음과 온기를 만든다. 집 전체가 주인공.\n- 성장·커리어: 일에서의 좌절과 성취가 관계와 얽혀 두 사람을 성장시킨다.\n- 재회·시간 점프: 몇 년 뒤로 건너뛰어 세월이 쌓인 관계의 무게를 그린다.\n\n5. 문체\n- 지문에서 주연 두 사람을 \"이 사람\", \"그 사람\"으로 지칭하지 않는다. 반드시 이름으로 쓴다. (조연을 문맥상 \"그 사람\"이라 하는 건 괜찮다)\n- 과묵한 인물의 대사 앞에 말줄임표(…)를 습관적으로 붙이지 않는다. 짧은 대답은 \"응.\", \"괜찮아.\"처럼 담백하게 쓰고, 정곡을 찔려 말문이 막힐 때, 사과·고백 직전의 머뭇거림, 빈 침묵 \"…\"에만 쓴다.\n- 문단 사이 불필요한 공백이나 문장 속 말줄임표를 흩뿌리지 않는다.\n- 대사로만 사건을 때우지 않고 지문·묘사·심리를 갖춘다. 다만 묘사를 위한 묘사로 분량을 늘리지 않는다.\n- 장 구분이 필요하면 \"## 1\", \"## 2\"처럼 소제목 줄을 쓴다.\n\n6. 적절성\n원작 인물이 미성년이거나 미성년으로 볼 수 있으면 성적·선정적 묘사를 하지 않는다. 로맨스는 정서와 관계 중심으로 그린다.\n\n7. 출력 전 스스로 점검 (점검 내용은 출력하지 않는다)\n같은 감정 비트 반복이 없는지, 매 씬이 직전과 다른지, 주연을 \"이 사람/그 사람\"으로 부른 곳이 없는지, 말줄임표가 꼭 필요한 곳에만 있는지, 분량용 문장이 없는지, 소품이 처음과 끝을 묶는지, 조연 기능이 겹치지 않는지, 호칭·말투를 정확히 지켰는지, 마음고생이 인물을 실제로 변화시켰는지 확인한다.";

const app=document.getElementById("app");

function toast(msg,ms=2600){ const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms) }
function backBtn(label="서재",act='data-tab="library"'){ return `<button class="back" ${act}>${ic("back")}${label}</button>` }
function sheet(html,onClick){
  const s=document.createElement("div");s.className="scrim";
  s.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  s.addEventListener("click",e=>{ if(e.target===s){s.remove();return} onClick&&onClick(e,()=>s.remove()) });
  document.body.appendChild(s); return s;
}
function render(){
  if(stack.length){ app.innerHTML=renderEditor(stack[stack.length-1]); return }
  const v={library:vLibrary,write:vWrite,setbook:vSetbook,prefs:vPrefs}[tab]();
  app.innerHTML=`<section class="view">${v}</section>`;
  if(tab==="write") bindWrite();
}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-tab],[data-act]"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; stack=[]; render(); app.querySelector(".scroll")?.scrollTo(0,0); return }

});

}
function bindWrite(){
  const t=curTpl();
  app.querySelectorAll(".blank").forEach(el=>{
    el.addEventListener("input",()=>{ (S.drafts[t.id] ||= {})[el.dataset.k]=el.textContent.trim(); if(!el.textContent.trim()) el.textContent=""; save() });
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const all=[...app.querySelectorAll(".blank")];const n=all[all.indexOf(el)+1];n?n.focus():app.querySelector("#scene").focus() } });
    el.addEventListener("paste",e=>{ e.preventDefault(); document.execCommand("insertText",false,(e.clipboardData.getData("text")||"").replace(/\s+/g," ")) });
  });
  app.querySelector("#scene").addEventListener("input",e=>{ S.scene=e.target.value; save() });
  const wi=app.querySelector("#words");
  wi.addEventListener("input",()=>{ wi.value=wi.value.replace(/[^0-9]/g,"").slice(0,5); const n=+wi.value; if(n>=WMIN&&n<=WMAX){ S.words=n; save() } });
  wi.addEventListener("blur",()=>{ let n=+wi.value||S.words; n=Math.min(WMAX,Math.max(WMIN,n)); if(+wi.value&&+wi.value!==n) toast(`분량은 ${WMIN}~${WMAX.toLocaleString()}어절 사이로 정할 수 있어요`); S.words=n; wi.value=n; save() });
  app.querySelector("#contStory")?.addEventListener("change",e=>{ S.contStory=e.target.value||null; save() });
}

const API="https://generativelanguage.googleapis.com/v1beta";
function cleanKey(v){
  return {key:v.replace(/[\u200B-\u200D\uFEFF]/g,"").trim()};
}
function apiFetch(url,opts,key){
  opts={...(opts||{})}; opts.headers={...(opts.headers||{})};
  if(/^[\x00-\xff]*$/.test(key)) opts.headers["x-goog-api-key"]=key;
  else url+=(url.includes("?")?"&":"?")+"key="+encodeURIComponent(key);
  return fetch(url,opts);
}

ACT.loadmodels=async(d,b)=>{
  const ck=cleanKey(app.querySelector("#f_key").value); if(ck.err){ toast(ck.err,3600); return } const key=ck.key; app.querySelector("#f_key").value=key; if(!key){ toast("API 키를 먼저 입력해주세요"); return }
  b.textContent="불러오는 중…"; b.disabled=true;
  try{
    const r=await apiFetch(`${API}/models?pageSize=1000`,{},key);
    const j=await r.json(); if(!r.ok) throw new Error(j.error?.message||r.status);
    modelCache=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/gemini/i.test(m.name)&&!/(embed|tts|image|audio|live|vision|aqa|robotics|computer)/i.test(m.name));
    const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
    modelCache.sort((a,b)=>ver(b.name)-ver(a.name)||(/pro/.test(b.name)-/pro/.test(a.name))||a.name.localeCompare(b.name));
    fillModels(modelCache,true); b.textContent=`${modelCache.length}개 불러왔어요`;
  }catch(e){ b.textContent="모델 목록 불러오기"; toast(/API key|API_KEY|permission|400|403/i.test(e.message)?"API 키가 맞지 않아요. AI Studio에서 키를 다시 확인해주세요.":"불러오지 못했어요: "+e.message,4200) }
  b.disabled=false;
};
function fillModels(list,pick){
  const sel=app.querySelector("#f_model"); if(!sel) return; const cur=sel.value||S.model;
  sel.innerHTML=list.map(m=>`<option value="${m.name}">${esc(m.displayName||m.name)} · ${esc(m.name.replace("models/",""))}</option>`).join("");
  if(list.some(m=>m.name===cur)) sel.value=cur;
  else if(pick){ const p=list.find(m=>/pro/i.test(m.name)&&!/(preview|exp)/i.test(m.name))||list.find(m=>/pro/i.test(m.name))||list[0]; if(p) sel.value=p.name }
}

/* ───────── 프롬프트 조립 · 생성 ───────── */
function buildPrompt(){
  const t=curTpl(), d=S.drafts[t.id]||{};
  const missing=[...t.body.matchAll(/\{\{(.+?)\}\}/g)].map(m=>m[1]).filter(k=>!(d[k]||"").trim());
  const filled=t.body.replace(/\{\{(.+?)\}\}/g,(_,k)=>(d[k]||"").trim()||`(${k}: 자유롭게)`);
  const w=S.works.find(x=>x.id===S.activeWork);
  let sys=S.basePrompt.trim();
  if(!t.cont && (S.fanficPrompt||"").trim()){
    sys+="\n\n"+S.fanficPrompt.trim();
    const past=S.stories.filter(x=>(x.workId||null)===(w?.id||null)).slice(0,20).map(x=>"- "+x.title);
    if(past.length) sys+=`\n\n[이전 작품 — 소재·구조가 겹치지 않게]\n${past.join("\n")}`;
  }
  sys+="\n\n[출력 형식]\n첫 줄에 '# 제목' 형식으로 이 이야기의 제목을 쓰고, 빈 줄 다음에 본문을 써줘. 본문의 문단은 빈 줄로 구분해줘.";
  if(w){
    sys+=`\n\n[설정집: ${w.name}]`;
    if((w.memo||"").trim()) sys+=`\n${w.memo.trim()}`;
  }
  let user=`[요청]\n${filled}`;
  if(S.scene.trim()) user+=`\n\n[꼭 넣을 장면]\n${S.scene.trim()}`;
  user+=`\n\n[분량]\n약 ${S.words.toLocaleString()}어절(띄어쓰기로 나뉜 단위) 내외. 이 분량에 맞춰 장면을 구성해줘.`;
  let prev=null;
  if(t.cont){
    prev=S.stories.find(s=>s.id===S.contStory);
    if(!prev) return {error:"이어 쓸 이야기를 골라주세요"};
    const body=prev.text.length>24000?"…(앞부분 생략)…\n"+prev.text.slice(-24000):prev.text;
    user=`[앞 이야기: ${prev.title}]\n${body}\n\n`+user+"\n\n제목은 앞 이야기와 이어지는 회차 제목으로 지어줘.";
  }
  return {sys,user,missing,prev,w};
}

let gen=null;
async function generate(){
  if(S.mode==='app'){ sendToApp(); return }
  if(!S.apiKey||!S.model){ toast("설정에서 Gemini API 키와 모델을 먼저 연결해주세요",3200); tab="prefs"; render(); setTimeout(geminiEditor,50); return }
  const p=buildPrompt(); if(p.error){ toast(p.error); return }
  if(p.missing.length===curTpl().body.match(/\{\{/g)?.length && !S.scene.trim()){ toast("빈칸을 하나 이상 채워주세요"); return }
  const ctrl=new AbortController();
  gen={ctrl,text:"",title:"",workId:p.w?.id||null,tplName:curTpl().name,prev:p.prev};
  openLive();
  try{
    const r=await apiFetch(`${API}/${S.model}:streamGenerateContent?alt=sse`,{method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({systemInstruction:{parts:[{text:p.sys}]},contents:[{role:"user",parts:[{text:p.user}]}],
        generationConfig:{temperature:S.temperature,maxOutputTokens:32768}})},S.apiKey);
    if(!r.ok){ let m=""; try{ m=(await r.json()).error?.message||"" }catch(_){} throw new Error(apiErr(r.status,m)) }
    const rd=r.body.getReader(), dec=new TextDecoder(); let buf="", block=null, finish=null;
    while(true){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!line.startsWith("data:")) continue;
        let j; try{ j=JSON.parse(line.slice(5)) }catch(_){ continue }
        if(j.promptFeedback?.blockReason) block=j.promptFeedback.blockReason;
        const c=j.candidates?.[0]; if(c?.finishReason) finish=c.finishReason;
        for(const part of c?.content?.parts||[]) if(part.text&&!part.thought){ gen.text+=part.text; updateLive() }
      }
    }
    if(!gen.text.trim()){
      throw new Error(block?"요청이 Gemini 안전 정책에 걸려 거절됐어요. 표현을 바꿔 다시 시도해주세요.":finish==="SAFETY"||finish==="PROHIBITED_CONTENT"?"Gemini가 안전 정책 때문에 쓰기를 멈췄어요. 표현을 바꿔 다시 시도해주세요.":"Gemini가 빈 답을 보냈어요. 다시 시도해주세요.");
    }
    finishGen(finish==="MAX_TOKENS"?"분량 한도에 닿아 끝부분이 잘렸을 수 있어요":(finish==="SAFETY"?"안전 정책 때문에 중간에 멈췄어요":null));
  }catch(e){
    if(e.name==="AbortError"){ if(gen.text.trim().length>100) finishGen("중간에 멈췄어요"); else { closeLive(); toast("멈췄어요") } return }
    if(gen.text.trim().length>300){ finishGen("연결이 끊겨 중간까지만 저장했어요") }
    else { closeLive(); toast(e.message==="Failed to fetch"?"인터넷 연결을 확인해주세요":e.message,4500) }
  }
}
function apiErr(st,m){
  if(st===400&&/API key/i.test(m)) return "API 키가 맞지 않아요. 설정에서 다시 확인해주세요.";
  if(st===403) return "이 API 키로는 해당 모델을 쓸 수 없어요. 설정에서 다른 모델을 골라주세요.";
  if(st===404) return "모델을 찾을 수 없어요. 설정에서 모델 목록을 다시 불러와주세요.";
  if(st===429) return "요청 한도를 넘었어요. 잠시 뒤 다시 쓰거나, 무료 한도라면 Flash 모델을 골라주세요.";
  if(st>=500) return "Gemini 서버가 응답하지 않아요. 잠시 뒤 다시 시도해주세요.";
  return `Gemini 오류(${st}) ${m}`.trim();
}
function splitTitle(text){
  const m=text.match(/^\s*#{1,3}\s*(.+?)\s*\n/)||text.match(/^\s*\**\s*제목\s*[:：]\s*(.+?)\s*\**\s*\n/)||text.match(/^\s*\*\*([^*\n]{1,40})\*\*\s*\n/);
  if(m) return {title:m[1].replace(/[*_]/g,"").trim(),body:text.slice(m[0].length)};
  return {title:"",body:text};
}
function finishGen(note){
  const {title,body}=splitTitle(cleanPaste(gen.text));
  const s={id:uid(),title:title||(gen.prev?gen.prev.title+" (이어서)":"제목 없는 이야기"),text:body.trim(),workId:gen.workId,tpl:gen.tplName,createdAt:Date.now(),progress:0,page:0,prevId:gen.prev?.id||null};
  S.stories.unshift(s); S.lastRead=s.id; save(); gen=null; tab="library"; stack=[]; render();
  closeLive(); openReader(s.id); if(note) toast(note,3200);
}

/* ───────── 본문 → HTML ───────── */
function bodyHTML(text){
  return text.replace(/\r/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    if(/^(\*\s*){3,}$|^[＊*]{1,3}$|^-{3,}$|^◇+$|^#\s*$/.test(l)) return `<p class="brk">＊＊＊</p>`;
    const h=l.match(/^#{1,4}\s*(.+)$/); if(h) return `<h2>${esc(h[1].replace(/[*_]/g,""))}</h2>`;
    return `<p>${esc(l).replace(/\*\*(.+?)\*\*/g,"$1").replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,"$1$2")}</p>`;
  }).join("");
}

/* ───────── 리더 ───────── */
let R=null; // {el, story, page, pages, step}
function readerVars(el){
  const r=S.reader;
  el.dataset.bg=r.bg==="theme"?"":r.bg;
  el.style.setProperty("--rfont",r.font==="serif"?"var(--serif)":"var(--sans)");
  el.style.setProperty("--rsize",r.size+"px");
  el.style.setProperty("--rlh",r.lh);
  el.style.setProperty("--rp",innerWidth<380?"26px":"32px");
}
function openLive(){
  closeLive();
  const el=document.createElement("div"); el.className="reader"; el.id="liveReader"; readerVars(el);
  el.innerHTML=`<div class="writing"><i></i>Gemini가 쓰는 중</div><div class="live" id="liveText"></div><div class="livebar"><button class="cta" id="stopGen">${ic("stop")}멈추기</button></div>`;
  document.body.appendChild(el);
  el.querySelector("#stopGen").onclick=()=>gen?.ctrl.abort();
}
let liveRaf=0;
function updateLive(){
  if(liveRaf) return; liveRaf=requestAnimationFrame(()=>{ liveRaf=0;
    const box=document.getElementById("liveText"); if(!box||!gen) return;
    const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
    const {title,body}=splitTitle(gen.text.includes("\n")?gen.text:gen.text+"\n");
    box.innerHTML=(title?`<p class="ttl">${esc(title)}</p>`:"")+bodyHTML(body);
    if(near) box.scrollTop=box.scrollHeight;
  });
}
function closeLive(){ document.getElementById("liveReader")?.remove() }

function openReader(id){
  const s=S.stories.find(x=>x.id===id); if(!s) return;
  S.lastRead=id; save();
  const el=document.createElement("div"); el.className="reader"; readerVars(el);
  el.innerHTML=`<div class="rtop"><button class="icon" data-r="close" aria-label="닫기" style="color:inherit">${ic("back")}</button><div class="t">${esc(s.title)}</div><button class="icon" data-r="menu" aria-label="보기 설정" style="color:inherit">${ic("aa")}</button></div>
    <div class="rbox"><div class="rflow"><p class="ttl">${esc(s.title)}</p>${bodyHTML(s.text)}<span class="end"></span></div></div>
    <div class="tapzone"><div data-r="prev" style="width:30%"></div><div data-r="mid" style="width:40%"></div><div data-r="next" style="width:30%"></div></div>
    <div class="rfoot"><span class="pn"></span><div class="prog"><i></i></div></div>`;
  document.body.appendChild(el);
  R={el,story:s,page:0,pages:1};
  layoutReader(true);
  el.addEventListener("click",e=>{ const b=e.target.closest("[data-r]"); if(!b) return; const a=b.dataset.r;
    if(a==="prev") turn(-1); else if(a==="next") turn(1); else if(a==="mid") el.classList.toggle("chrome");
    else if(a==="close") closeReader(); else if(a==="menu") readerSheet() });
  let sx=0,sy=0,st=0;
  el.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now() },{passive:true});
  el.addEventListener("touchend",e=>{ const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3&&Date.now()-st<700){ e.preventDefault(); turn(dx<0?1:-1) } });
  document.addEventListener("keydown",keyTurn);
}
function keyTurn(e){ if(!R) return; if(e.key==="ArrowRight"||e.key===" ") turn(1); else if(e.key==="ArrowLeft") turn(-1); else if(e.key==="Escape") closeReader() }
function layoutReader(restore){
  if(!R) return; const {el,story}=R; readerVars(el);
  const box=el.querySelector(".rbox"), flow=el.querySelector(".rflow");
  const w=box.clientWidth, gap=parseFloat(getComputedStyle(el).getPropertyValue("--rp"))*2;
  flow.style.columnWidth=w+"px"; flow.style.columnGap=gap+"px"; flow.style.width=w+"px";
  R.step=w+gap;
  const ratio=restore?(story.progress||0):(R.pages>1?R.page/(R.pages-1):0);
  flow.style.transition="none";
  requestAnimationFrame(()=>{
    const end=flow.querySelector(".end");
    R.pages=Math.max(1,Math.round(end.offsetLeft/R.step)+1);
    R.page=Math.min(R.pages-1,Math.round(ratio*(R.pages-1)));
    paint(); requestAnimationFrame(()=>flow.style.transition="");
  });
}
function paint(){
  const {el,page,pages,step}=R;
  el.querySelector(".rflow").style.transform=`translateX(${-page*step}px)`;
  el.querySelector(".pn").textContent=`${page+1} / ${pages}`;
  const prog=pages>1?page/(pages-1):1;
  el.querySelector(".rfoot .prog i").style.width=(prog*100)+"%";
  R.story.progress=prog; save();
}
function turn(d){
  if(!R) return; const n=R.page+d;
  if(n<0) return;
  if(n>=R.pages){ endSheet(); return }
  R.page=n; R.el.classList.remove("chrome"); paint();
}
function closeReader(){ if(!R) return; R.el.remove(); document.removeEventListener("keydown",keyTurn); R=null; document.querySelector(".scrim")?.remove(); render() }
addEventListener("resize",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(()=>layoutReader(false),150) });

function readerSheet(){
  const r=S.reader;
  const bgs=[["theme",isDark()?"#121416":"#F7F7F5","기본"],["gray","#E7ECEF","회색"],["dim","#1A2024","어둡게"],["black","#000000","검정"]];
  const s=sheet(`<div class="rsheet">
    <div class="swatches" role="radiogroup" aria-label="배경">${bgs.map(([k,c,l])=>`<button class="sw" data-bg="${k}" aria-label="${l}" aria-checked="${r.bg===k}" style="background:${c}"></button>`).join("")}</div>
    <div class="seg" role="group" aria-label="글꼴"><button data-font="serif" class="serif" aria-pressed="${r.font==="serif"}">명조</button><button data-font="sans" aria-pressed="${r.font==="sans"}">고딕</button></div>
    <div class="slider"><span class="s">가</span><input type="range" id="rsz" min="14" max="26" step="1" value="${r.size}" aria-label="글자 크기"><span class="l">가</span></div>
    <div class="slider"><span class="s">≡</span><input type="range" id="rlh" min="1.5" max="2.4" step="0.1" value="${r.lh}" aria-label="줄 간격"><span class="l">≡</span></div>
    <div class="acts"><button class="textbtn" data-x="cont">이어 쓰기</button><button class="textbtn" data-x="del" style="color:var(--danger)">삭제</button></div></div>`,
    (e,close)=>{
      const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.bg){ r.bg=b.dataset.bg; s.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-checked",x===b)); save(); layoutReader(false) }
      if(b.dataset.font){ r.font=b.dataset.font; s.querySelectorAll("[data-font]").forEach(x=>x.setAttribute("aria-pressed",x===b)); save(); layoutReader(false) }
      if(b.dataset.x==="cont"){ const id=R.story.id; close(); closeReader(); startCont(id) }
      if(b.dataset.x==="del"){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="한 번 더 누르면 삭제"; return }
        S.stories=S.stories.filter(x=>x.id!==R.story.id); if(S.lastRead===R.story.id) S.lastRead=null; save(); close(); closeReader(); toast("삭제했어요") }
    });
  s.querySelector("#rsz").oninput=e=>{ r.size=+e.target.value; save(); layoutReader(false) };
  s.querySelector("#rlh").oninput=e=>{ r.lh=+e.target.value; save(); layoutReader(false) };
}
function endSheet(){
  const id=R.story.id;
  sheet(`<div style="text-align:center;padding:6px 0 4px"><div class="serif" style="font-size:19px;font-weight:700;margin-bottom:22px">끝까지 읽었어요</div>
    <div style="display:flex;justify-content:center"><button class="cta" data-x="cont">${ic("spark")}이어 쓰기</button></div>
    <button class="textbtn" data-x="lib" style="margin-top:14px;color:var(--ink2)">서재로</button></div>`,
    (e,close)=>{ const b=e.target.closest("[data-x]"); if(!b) return; close(); closeReader(); if(b.dataset.x==="cont") startCont(id) });
}
function startCont(id){
  const t=S.templates.find(x=>x.cont); if(!t){ toast("설정집 › 템플릿에서 '이어 쓰기' 템플릿을 켜주세요"); return }
  S.activeTemplate=t.id; S.contStory=id; const st=S.stories.find(x=>x.id===id); if(st?.workId) S.activeWork=st.workId; save(); tab="write"; render();
}

/* ───────── 붙여넣기 모드 ───────── */
function appPromptText(p){
  return `${p.sys}\n\n${p.user}\n\n(위 지시에 따라 소설 본문만 출력해줘. 첫 줄은 '# 제목'으로 시작해줘.)`;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true }catch(_){
    const ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); let ok=false; try{ ok=document.execCommand("copy") }catch(_){} ta.remove(); return ok }
}
function sendToApp(){
  const p=buildPrompt(); if(p.error){ toast(p.error); return }
  if(p.missing.length===curTpl().body.match(/\{\{/g)?.length && !S.scene.trim()){ toast("빈칸을 하나 이상 채워주세요"); return }
  const prompt=appPromptText(p);
  S.pending={prompt,workId:p.w?.id||null,tplName:curTpl().name,prevId:p.prev?.id||null,at:Date.now(),draft:""}; save();
  copyText(prompt).then(ok=>{ openPending(ok) });
}
function openPending(copied){
  document.querySelector(".pend")?.remove();
  const pd=S.pending; if(!pd) return;
  const el=document.createElement("div"); el.className="pend";
  el.innerHTML=`<div class="head" style="padding-left:10px;padding-right:14px"><button class="icon" data-p="cancel" aria-label="취소">${ic("back")}</button><div style="font-weight:700;font-size:16px;flex:1;text-align:center">Gemini 앱으로 쓰기</div><span style="width:40px"></span></div>
   <div class="scroll" style="display:flex;flex-direction:column">
     <div class="steps">
       <div class="on"><b>1</b><span>${copied===false?"아래 버튼으로 프롬프트를 복사해요":"프롬프트를 복사했어요"}</span></div>
       <div class="on"><b>2</b><span>Gemini에 붙여넣고 답을 받아요</span></div>
       <div class="on"><b>3</b><span>답을 복사해 와서 아래에 붙여넣어요</span></div>
     </div>
     <div class="minirow">
       <a class="ghost" href="https://gemini.google.com/app" target="_blank" rel="noopener">${ic("ext")}Gemini 열기</a>
       <button class="ghost" data-p="copy">${ic("copy")}프롬프트 복사</button>
     </div>
     <textarea class="pastebox" id="pasteBox" placeholder="Gemini의 답을 여기에 붙여넣기">${esc(pd.draft||"")}</textarea>
     <div class="minirow" style="margin-top:12px"><button class="textbtn" data-p="paste">클립보드에서 붙여넣기</button><span id="pcount" style="margin-left:auto;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums"></span></div>
   </div>
   <div class="cta-wrap" style="padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))"><button class="cta" data-p="done" id="pdone">${ic("book")}서재에 넣기</button></div>`;
  document.body.appendChild(el);
  const box=el.querySelector("#pasteBox"), done=el.querySelector("#pdone"), cnt=el.querySelector("#pcount");
  const upd=()=>{ const n=box.value.trim().length; done.disabled=n<20; cnt.textContent=n?`${n.toLocaleString()}자`:""; pd.draft=box.value; save() };
  box.addEventListener("input",upd); upd();
  el.addEventListener("click",async e=>{
    const b=e.target.closest("[data-p]"); if(!b) return; const a=b.dataset.p;
    if(a==="copy"){ toast(await copyText(pd.prompt)?"프롬프트를 복사했어요":"복사하지 못했어요. 다시 눌러주세요",1600) }
    if(a==="paste"){ try{ const t=await navigator.clipboard.readText(); if(t){ box.value=t; upd() } else toast("클립보드가 비어 있어요") }catch(_){ box.focus(); toast("입력칸을 길게 눌러 붙여넣어 주세요",2400) } }
    if(a==="cancel"){
      if(b.dataset.armed!=="1"&&box.value.trim()){ b.dataset.armed="1"; toast("붙여넣은 내용이 있어요. 한 번 더 누르면 취소돼요",2000); return }
      S.pending=null; save(); el.remove(); render() }
    if(a==="done"){
      const raw=box.value; if(raw.trim().length<20) return;
      if(raw.trim()===pd.prompt.trim()){ toast("프롬프트가 붙여넣어졌어요. Gemini의 답을 복사해 와주세요",2800); return }
      gen={text:raw,workId:pd.workId,tplName:pd.tplName,prev:S.stories.find(x=>x.id===pd.prevId)||null};
      S.pending=null; el.remove(); finishGen(null);
    }
  });
}
function cleanPaste(t){
  t=t.replace(/\r/g,"").trim();
  // Gemini 앱이 붙이는 앞뒤 인사말·코드블록 정리
  t=t.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/,"");
  const lines=t.split("\n");
  const hi=lines.findIndex(l=>/^\s*#{1,3}\s*\S/.test(l));
  if(hi>0&&hi<=3&&lines.slice(0,hi).join("").length<200) t=lines.slice(hi).join("\n");
  return t;
}

/* ───────── 시작 ───────── */
(async()=>{
  const saved=await store.get();
  S={...structuredClone(DEFAULTS),...(saved||{})};
  S.reader={...DEFAULTS.reader,...S.reader};
  for(const w of S.works){
    if(w.memo===undefined){
      const parts=[["등장인물",w.chars],["관계 · 호칭",w.relations],["세계관",w.world]].filter(([,v])=>(v||"").trim());
      w.memo=parts.map(([k,v])=>`[${k}]\n${v.trim()}`).join("\n\n");
      delete w.chars; delete w.relations; delete w.world;
    }
  }
  if(saved) save();
  if(!(S.words>=WMIN)) S.words=1500;
  if(!S.mode) S.mode=S.apiKey?"api":"app";
  applyTheme(); render();
  if(S.pending){ tab="write"; render(); openPending(null) }
  if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
