<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이야기">
<meta name="theme-color" content="#F7F7F5" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="fonts/pretendardvariable-dynamic-subset.css">
<style>
/* 미니멀 · 고운 그레인 · 세이지 그린 윤곽 · 서재 중심(탭 없음) */
:root{
  --bg:#F7F7F5; --ink:#141619; --ink2:#4A4F55; --ink3:#858B91; --line:#E2E2DE;
  --accent:#141619; --fill:#EEEEEB; --sheet:#F9F9F7; --danger:#B3413A;
  --grain:.18; --blend:normal;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --serif:"Noto Serif KR","AppleMyungjo","Batang",serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121416; --ink:#ECEEEF; --ink2:#B2B7BB; --ink3:#7B8287; --line:#25292C;
  --accent:#ECEEEF; --fill:#1A1D20; --sheet:#16191B; --danger:#E58A82;
  --grain:.14; --blend:normal; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:var(--grain);mix-blend-mode:var(--blend);background:url(grain.png) 0 0/128px 128px repeat}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
.serif{font-family:var(--serif)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 0;min-height:64px;flex:none;gap:12px}
.h1{font-size:26px;font-weight:700;letter-spacing:-.6px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px 24px}
.icon{width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);border-radius:20px}
.icon svg{width:22px;height:22px}
.scroll{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:16px;margin-left:-8px;padding:8px 8px 8px 0}
.back svg{width:22px;height:22px}
.headlinks{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:15px}
.headlinks .tl{padding:8px 6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-top:8px}
.row .sub{display:block;font-size:13px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lft{min-width:0;flex:1}
.memo-name{width:100%;border:0;background:transparent;outline:none;font-family:var(--serif);font-size:24px;font-weight:700;margin-top:8px;padding:4px 0}
.memo-name::placeholder{color:var(--ink3)}
.memo{width:100%;border:0;background:transparent;outline:none;resize:none;font-size:16px;line-height:1.95;margin-top:12px;min-height:60vh;word-break:keep-all}
.memo::placeholder{color:var(--ink3)}

.texttabs{display:flex;gap:20px;font-size:15px;color:var(--ink3);flex-wrap:wrap;row-gap:12px}
.texttabs button{padding:4px 0;position:relative}
.texttabs button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.texttabs button[aria-pressed="true"]:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:var(--accent);border-radius:1px}

.workpick{display:flex;align-items:center;gap:2px;font-size:14.5px;color:var(--ink2);max-width:55%}
.workpick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workpick svg{width:16px;height:16px;flex:none}

.tpl{margin-top:30px;font-family:var(--serif);font-size:18px;line-height:2.2;word-break:keep-all;color:var(--ink)}
.blank{color:var(--accent);border-bottom:2px solid var(--accent);padding:0 2px;outline:none;font-weight:700;min-width:2.5em;display:inline;-webkit-user-select:text;user-select:text;cursor:text}
.blank:empty{display:inline-block;min-width:3em;line-height:1.5}
.blank:empty:before{content:attr(data-ph);color:var(--ink3);font-weight:500}
.blank:focus{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.line-input{width:100%;margin-top:28px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0 12px;outline:none;font-size:16px}
.line-input::placeholder{color:var(--ink3)}
.line-input:focus{border-bottom-color:var(--accent)}
select.line-input{appearance:none;-webkit-appearance:none}
.titlerow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.titleacts{display:flex;align-items:center;gap:6px}
.resetbtn{font-size:14px;color:var(--ink3);padding:6px 0 6px 10px}
.randbtn{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--accent);font-weight:700;padding:6px 6px}
.randbtn svg{width:16px;height:16px}
.randbtn:disabled{opacity:.5}
.randbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.resetbtn[data-armed="1"]{color:var(--danger);font-weight:700}
.genre{display:flex;align-items:center;gap:12px;margin-top:26px;font-size:15px;color:var(--ink3)}
.genre .sel{position:relative;flex:1;min-width:0}
.genre select{width:100%;appearance:none;-webkit-appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 26px 8px 0;font-size:16px;color:var(--ink);font-weight:600;outline:none}
.genre select:focus{border-bottom-color:var(--accent)}
.genre select.none{color:var(--ink3);font-weight:500}
.genre .sel svg{position:absolute;right:2px;top:50%;width:16px;height:16px;transform:translateY(-50%) rotate(90deg);color:var(--ink3);pointer-events:none}
.genre-custom{margin-top:10px}
textarea.line-input{resize:none;overflow:hidden;line-height:1.6;min-height:46px;display:block;font-family:inherit}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--ink2);margin-top:30px}
.lbl .textbtn{font-size:13.5px;padding:4px 0;color:var(--ink)}
.plotmemo{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:transparent;outline:none;resize:none;overflow:hidden;font:inherit;font-size:16px;line-height:1.6;min-height:52px;display:block}
.plotmemo:focus{border-color:var(--ink3)}
.plotmemo::placeholder{color:var(--ink3)}
.expbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--ink);font-size:14px;font-weight:700;margin-top:10px}
.expbtn svg{width:15px;height:15px}
.expbtn:disabled{opacity:.45}
.pst{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.pst .n{width:18px;font-size:13px;color:var(--ink3);flex:none;padding-top:5px;font-variant-numeric:tabular-nums}
.pst .bd{flex:1;min-width:0}
.pst input,.pst textarea{width:100%;border:0;background:transparent;outline:none;font:inherit;color:inherit;resize:none;overflow:hidden;display:block;padding:2px 0}
.pst input{font-size:15.5px;font-weight:700}
.pst textarea{font-size:13.5px;color:var(--ink2);line-height:1.55;min-height:22px}
.pst input::placeholder,.pst textarea::placeholder{color:var(--ink3);font-weight:500}
.pst .x{color:var(--ink3);flex:none;width:28px;height:28px;display:grid;place-items:center}
.pst .x svg{width:15px;height:15px}
.addstep{display:flex;align-items:center;gap:10px;padding:12px 0;color:var(--ink3);font-size:15px}
.addstep svg{width:16px;height:16px}
.splitrow{display:flex;align-items:center;gap:12px;margin-top:22px;padding:14px 0;border-top:1px solid var(--line)}
.splitrow span{flex:1;font-size:15.5px;font-weight:600}
.tog{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.tog[aria-checked="true"]{background:var(--ink)}
.tog[aria-checked="true"]:after{left:21px}
.words{display:flex;align-items:baseline;gap:8px;margin-top:26px;font-size:15px;color:var(--ink3)}
.words input{width:5.5em;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0 6px;text-align:right;font-weight:700;color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.words input:focus{border-bottom-color:var(--accent)}

.cta-wrap{display:flex;justify-content:center;padding:14px 24px calc(18px + env(safe-area-inset-bottom,0px));flex:none}
.cta{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 26px;border-radius:24px;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:16.5px}
.cta svg{width:17px;height:17px}
.cta:disabled{opacity:.4}
.cta:active{background:color-mix(in srgb,var(--accent) 10%,transparent)}

.cap{font-size:13px;color:var(--ink2);font-weight:700;margin:32px 0 2px;display:flex;justify-content:space-between;align-items:center}
.cap button{color:var(--ink3);font-weight:500;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:17px 0;border-bottom:1px solid var(--line);font-size:16.5px;text-align:left}
.row .val{color:var(--ink3);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:13em}
.row svg{width:17px;height:17px;color:var(--ink3);flex:none}
.dot{width:7px;height:7px;border-radius:4px;background:var(--accent);display:inline-block}
.dot.off{background:var(--ink3)}

.now{margin-top:26px;padding:20px 0 24px;border-bottom:1px solid var(--line);display:block;width:100%;text-align:left}
.now .k{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:8px}
.now .t{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:-.4px}
.prog{height:2px;background:var(--line);margin-top:14px;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.prog.done i{background:var(--ink3)}
.item{display:block;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid var(--line)}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.item .t{font-family:var(--serif);font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .w{font-size:13px;color:var(--ink2);flex:none}
/* 서재 · 원작별 펼치는 목록 (단색·최소, 위계는 크기·들여쓰기로) */
.resume{display:block;width:100%;text-align:left;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--fill)}
.resume .k{display:block;font-size:12px;color:var(--ink3)}
.resume .row1{display:flex;align-items:baseline;gap:10px;margin-top:3px}
.resume .t{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .pp{font-size:13px;color:var(--ink2);flex:none;font-variant-numeric:tabular-nums}
.libcap{font-size:12px;color:var(--ink3);margin:26px 0 2px}
.wk{border-bottom:1px solid var(--line)}
.wk-h{display:flex;align-items:center;gap:10px;width:100%;padding:16px 0;text-align:left}
.wk-h .n{font-size:19px;font-weight:800;letter-spacing:-.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk:not(.open) .wk-h .n{color:var(--ink2);font-weight:700}
.wk-h .c{font-size:13px;color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}
.wk-h svg{width:16px;height:16px;color:var(--ink3);transition:transform .2s;flex:none}
.wk.open .wk-h svg{transform:rotate(90deg)}
.wk-b{margin:0 0 16px 2px;padding-left:14px;border-left:2px solid var(--line)}
.st{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0;padding-top:2px}
.st .t{font-size:15.5px;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .s{font-size:13.5px;line-height:1.5;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .m{font-size:12px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
.more{display:block;padding:8px 0 2px;font-size:13px;color:var(--ink3);border-top:1px solid var(--line);width:100%;text-align:left}
.libcta .cta{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* (이전) 서재 · 종이 카드 */
:root{--card:#FFFFFF}
:root[data-theme="dark"]{--card:#1A1D20}
.hero{display:block;width:100%;text-align:left;margin-top:18px;background:var(--card);border-radius:16px;padding:18px 18px 16px;box-shadow:0 1px 0 var(--line),0 8px 20px rgba(0,0,0,.05)}
.hero .k{font-size:12px;font-weight:700;color:var(--accent)}
.hero .t{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:6px;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .ex{font-family:var(--serif);font-size:14px;line-height:1.75;color:var(--ink2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.hero .pr{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.hero .pr .prog{flex:1;margin:0}
.shelf{margin-top:26px}
.shelf .sh{display:flex;justify-content:space-between;align-items:baseline;font-size:15.5px;font-weight:700}
.shelf .sh span{font-size:12.5px;color:var(--ink3);font-weight:500}
.shelf .row-x{display:flex;gap:10px;overflow-x:auto;margin:10px -24px 0;padding:2px 24px 6px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shelf .row-x::-webkit-scrollbar{display:none}
.pcard{width:124px;height:136px;flex:none;scroll-snap-align:start;scroll-margin-left:24px;background:var(--card);border-radius:12px;padding:12px 12px 11px;display:flex;flex-direction:column;text-align:left;box-shadow:0 1px 0 var(--line)}
.pcard .t{font-family:var(--serif);font-size:14.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.pcard .ex{font-family:var(--serif);font-size:11.5px;line-height:1.6;color:var(--ink3);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.pcard .pr{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);white-space:nowrap}
.pcard .pr .prog{flex:1;margin:0}
.libcta{position:relative}
.libcta:before{content:"";position:absolute;left:0;right:0;bottom:100%;height:40px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.empty{padding:56px 0;text-align:center;color:var(--ink3);line-height:1.8;font-size:15px}
.empty b{color:var(--ink);display:block;font-family:var(--serif);font-size:18px;margin-bottom:6px}

/* 편집 화면 */
.field{margin-top:22px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.field input,.field textarea,.field select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;outline:none;line-height:1.7}
.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:180px;resize:vertical}
.keyin.masked{-webkit-text-security:disc}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.hint{font-size:13px;color:var(--ink3);margin-top:8px;line-height:1.6}
.textbtn{color:var(--accent);font-weight:700;font-size:15.5px;padding:8px 4px}
.danger{color:var(--danger);font-weight:700;font-size:15px;padding:18px 0;display:block}
.seg{display:flex;gap:20px;font-size:15px;color:var(--ink3)}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(5,10,14,.28);z-index:50;display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet{width:100%;background:var(--sheet);border-radius:22px 22px 0 0;padding:12px 24px calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);max-height:80%;overflow-y:auto;animation:up .22s ease}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 0;border-bottom:1px solid var(--line);font-size:16.5px;text-align:left}
.sheet .opt[aria-checked="true"]{color:var(--accent);font-weight:700}
.sheet .opt svg{width:18px;height:18px;flex:none}
svg{flex:none}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:80;max-width:86%;text-align:center;line-height:1.5}

/* 리더 */
.reader{position:fixed;inset:0;z-index:40;background:var(--rbg);color:var(--rink);--rbg:var(--bg);--rink:var(--ink);--rmut:var(--ink3);--rline:var(--line)}
.reader[data-bg="gray"]{--rbg:#E7ECEF;--rink:#13181B;--rmut:#6D777E;--rline:#CDD5DA}
.reader[data-bg="dim"]{--rbg:#1A2024;--rink:#DCE3E7;--rmut:#7A858C;--rline:#2C353B}
.reader[data-bg="black"]{--rbg:#000;--rink:#C8CED2;--rmut:#5E676D;--rline:#1C2125}
.rbox{position:absolute;left:var(--rp);right:var(--rp);top:calc(env(safe-area-inset-top,0px) + 52px);bottom:calc(env(safe-area-inset-bottom,0px) + 52px);overflow:visible}
.rflow{height:100%;column-fill:auto;font-family:var(--rfont);font-size:var(--rsize);line-height:var(--rlh);word-break:keep-all;overflow-wrap:break-word;transition:transform .28s ease;will-change:transform}
.rflow p{text-indent:1em;margin:0 0 .6em}
.rflow .ttl{text-align:center;font-weight:700;font-size:1.25em;line-height:1.5;margin:1.2em 0 1.6em;text-indent:0;break-after:avoid}
.rflow h2,.live h2{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--rmut);text-align:left;margin:1.8em 0 1.1em;break-after:avoid;text-indent:0}
.rflow h2:after,.live h2:after{content:"";flex:1;height:1px;background:var(--rline)}
.rflow .brk{text-align:center;text-indent:0;color:var(--rmut);margin:1.2em 0;letter-spacing:.6em}
.rflow .end{display:inline-block;width:1px;height:1px}
.rfoot{position:absolute;left:var(--rp);right:var(--rp);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;gap:14px;font-size:12px;color:var(--rmut);font-variant-numeric:tabular-nums}
.rfoot .prog{flex:1;margin:0;background:var(--rline)}
.rtop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 14px 8px;display:flex;justify-content:space-between;align-items:center;background:var(--rbg);color:var(--rmut);border-bottom:1px solid var(--rline);transition:opacity .2s, transform .2s;z-index:3}

<script>
"use strict";
/* ───────── 저장소 (IndexedDB, 실패 시 localStorage) ───────── */
const DBN="iyagi-gongbang", KEY="state";
const store={
  db:null,
  async open(){ if(this.db) return this.db; return this.db=await new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}) },
  async get(){ try{const db=await this.open();return await new Promise((res,rej)=>{const t=db.transaction("kv").objectStore("kv").get(KEY);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}catch(e){try{return JSON.parse(localStorage.getItem(DBN)||"null")}catch(_){return null}} },
  async set(v){ try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){try{localStorage.setItem(DBN,JSON.stringify(v))}catch(_){toast("저장 공간이 부족해요. 설정에서 백업 후 오래된 이야기를 지워주세요.")}} }
};

const FANFIC_DEFAULT="[2차 창작 집필 지침]\n분량이 아니라 밀도로 완성하는 2차 창작 소설을 쓴다. 입체적인 글은 분량이 아니라 변화의 개수로 만들어진다.\n\n1. 설정\n- 요청과 설정집에 적힌 원작, 주연, 호칭, 말투가 항상 우선이다. 호칭과 말투(반말/존댓말)는 지정된 대로만 쓰고 임의로 바꾸지 않는다.\n- 비어 있는 항목은 원작의 성격과 관계성을 계승해 합리적으로 정한다. 되묻지 말고 바로 쓴다.\n- 이번 이야기는 완전히 새로운 플롯이어야 한다. 아래 '이전 작품'이 있으면 소재와 구조가 겹치지 않게 한다.\n\n2. 쓰기 전 설계 (설계 내용은 출력하지 않는다)\n- 중심 사건 하나를 정하고, 그것이 인물을 실제로 어떻게 바꾸는지 결말선을 먼저 잡는다.\n- 씬 목록을 만들되, 각 씬은 직전 씬과 무대·온도·감정 방향 중 최소 하나가 다르게 배치한다. (예: 질투 → 들통 → 역공 → 반전)\n- 주연 중 한 명(보통 과묵한 쪽)에게 질투·불안·오해·후회 중 하나로 속을 태우는 마음고생 라인을 반드시 준다. 겉은 무표정해도 내면이 무너지는 대비를 쓰고, 논리로 말하던 인물이라면 그 논리가 무너지는 지점(감정을 다른 이름으로 부르다 들키는 식)을 보여준다. 거짓말할 때의 버릇 같은 tell은 한두 개만 정해 남발하지 않는다.\n- 조연에게 각기 다른 기능을 준다. 사건을 굴리는 자, 온도를 올리는 자, 반전의 단서를 심는 자. 같은 역할의 조연을 중복 배치하지 않는다.\n- 소품이나 모티프 하나를 정해 발단과 결말을 묶는다. 발단이 된 사물이 마지막 회수 지점이 되게 한다.\n\n3. 서사 원칙\n- 모든 문장과 대사에 의미가 있어야 한다. 필요한 만큼만 쓰고, 필요 없어지면 끝낸다. 특정 순간을 길게 묘사하려면 그럴 가치가 있어야 한다.\n- 한 씬은 한 번만. 같은 감정 비트를 조금씩 바꿔 반복하지 않는다. 같은 대사나 같은 깨달음을 여러 조연에게 시키지 않는다.\n- 분량이 길면 그만큼 장면 전환·씬·감정 변화가 많아야 한다. 무대를 계속 바꾼다.\n- 감정은 축적되고 방향을 튼다. 위기·오해·질투는 해소되며 인물을 실제로 한 뼘 자라게 한다.\n- 지정 분량은 하한일 뿐이다. 분량이 모자라면 문장을 늘리지 말고 새로운 씬, 감정이 한 번 더 방향을 트는 지점, 조연의 새 기능으로 새 국면을 연다.\n- 중심 소재는 결말에서 회수한다.\n\n4. 장르·톤\n분위기나 요청에 아래 장르가 오면 그 특징을 따른다. 두 장르를 조합할 때는 번갈아 놓지 말고 원인과 결과로 엮는다. (예: 질투가 원인이 되어 잘못을 저지르고 → 후회로 만회)\n- 후회남주: 무심함·오해로 상처를 준 인물이 뒤늦게 깨닫고 만회한다. 사과해 본 적 없는 인물이 처음 사과하는 순간이 전환점.\n- 피폐·이별 위기: 권태·오해·자존심이 곪아 관계가 무너지기 직전까지 갔다가 밑바닥에서 되돌아온다. 무겁고 진지하게.\n- 달달·슈가러시: 갈등은 거의 없거나 가볍게, 애정 표현과 다정한 순간에 집중한다.\n- 코미디·시트콤: 작은 사건 하나가 하루 안에 사방으로 굴러가고, 끝에 감정으로 착지한다. 무대를 빠르게 바꾼다.\n- 질투·오해: 제3자의 등장으로 한쪽이 속을 태운다. 실제 위협은 없어도 마음고생이 이야기를 끈다.\n- 잔잔·힐링: 큰 사건 없이 계절과 생활의 결을 따라가며, 소품과 반복되는 일상으로 관계의 깊이를 드러낸다.\n- 판타지 한 스푼: 회귀·몸 바뀜·미래 보기처럼 설정 하나만 비틀고, 그 가정 위에서 관계를 다시 비춘다.\n- 가족 드라마: 주변 가족과 인물이 크게 개입해 웃음과 온기를 만든다. 집 전체가 주인공.\n- 성장·커리어: 일에서의 좌절과 성취가 관계와 얽혀 두 사람을 성장시킨다.\n- 재회·시간 점프: 몇 년 뒤로 건너뛰어 세월이 쌓인 관계의 무게를 그린다.\n\n5. 문체\n- 지문에서 주연 두 사람을 \"이 사람\", \"그 사람\"으로 지칭하지 않는다. 반드시 이름으로 쓴다. (조연을 문맥상 \"그 사람\"이라 하는 건 괜찮다)\n- 과묵한 인물의 대사 앞에 말줄임표(…)를 습관적으로 붙이지 않는다. 짧은 대답은 \"응.\", \"괜찮아.\"처럼 담백하게 쓰고, 정곡을 찔려 말문이 막힐 때, 사과·고백 직전의 머뭇거림, 빈 침묵 \"…\"에만 쓴다.\n- 문단 사이 불필요한 공백이나 문장 속 말줄임표를 흩뿌리지 않는다.\n- 대사로만 사건을 때우지 않고 지문·묘사·심리를 갖춘다. 다만 묘사를 위한 묘사로 분량을 늘리지 않는다.\n- 장 구분이 필요하면 \"## 1\", \"## 2\"처럼 소제목 줄을 쓴다.\n\n6. 적절성\n원작 인물이 미성년이거나 미성년으로 볼 수 있으면 성적·선정적 묘사를 하지 않는다. 로맨스는 정서와 관계 중심으로 그린다.\n\n7. 출력 전 스스로 점검 (점검 내용은 출력하지 않는다)\n같은 감정 비트 반복이 없는지, 매 씬이 직전과 다른지, 주연을 \"이 사람/그 사람\"으로 부른 곳이 없는지, 말줄임표가 꼭 필요한 곳에만 있는지, 분량용 문장이 없는지, 소품이 처음과 끝을 묶는지, 조연 기능이 겹치지 않는지, 호칭·말투를 정확히 지켰는지, 마음고생이 인물을 실제로 변화시켰는지 확인한다.";

function toast(msg,ms=2600){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms) }

  const close=()=>{ if(!s.isConnected) return; s.remove(); onClose&&onClose() };

  document.body.appendChild(s); return s;

const WORK_COLORS=["#3F6470","#6B5470","#7A6440","#4F6B4A","#7A4E4E","#4E5A7A"];
function workColor(k){ if(k==="none") return "#6F767C"; const i=S.works.findIndex(w=>w.id===k); return WORK_COLORS[(i<0?0:i)%WORK_COLORS.length] }

function trimWords(t,n){ const w=(t||"").trim().split(/\s+/).filter(Boolean); return w.length>n?w.slice(0,n).join(" ")+"…":w.join(" ") }

    <div class="libcap">원작</div>

async function autoSplit(b){
  if(noteBusy) return; const n=pad(); const text=n.secs.map(s=>s.memo).join("\n\n").trim();
  if(!text){ app.querySelector(".nta")?.focus(); return }
  const total=n.divided?padTotal():S.words; let parts=null;
  const arrows=text.split(/\s*(?:→|->|⇒)\s*/).map(x=>x.trim()).filter(Boolean);
  if(arrows.length>=2&&arrows.every(x=>x.length<=60)) parts=arrows.map(x=>x.length<=14?{title:x,memo:""}:{title:"",memo:x});
  else {
    let units=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    if(units.length<2) units=text.split(/(?<=[.!?。…])\s+/).map(x=>x.trim()).filter(Boolean);
    if(units.length<2){ toast("나눌 내용이 더 필요해요",1600); return }
    if(S.apiKey&&S.model){
      noteBusy=true; busy(b,true);
      try{
        const o=await aiJSON(`소설 메모를 이야기 전개 단계로 나눠줘.\n\n${planCtx()}\n\n[메모 — 앞의 번호는 문단 번호]\n${units.map((u,i)=>`[${i}] ${u}`).join("\n")}\n\n규칙:\n- 문단을 쪼개거나 순서를 바꾸지 말고, 이어진 문단을 묶어 3~7단계로 나눠. 문단이 7개 이하면 문단 하나가 한 단계여도 돼.\n- start는 그 단계가 시작하는 문단 번호. 첫 단계는 0.\n- title은 그 단계를 요약하는 2~8자 짧은 이름.`,
          {type:"OBJECT",properties:{steps:ARR({title:{type:"STRING"},start:{type:"INTEGER"}},["title","start"])},required:["steps"]},{temp:0.4});
        const st=(o.steps||[]).map(x=>({title:String(x.title||"").trim(),start:+x.start})).filter(x=>Number.isInteger(x.start));
        if(st.length&&st[0].start===0&&st.every((x,j)=>j===0||x.start>st[j-1].start)&&st[st.length-1].start<units.length)
          parts=st.map((x,j)=>({title:x.title.slice(0,20),memo:units.slice(x.start,j+1<st.length?st[j+1].start:units.length).join("\n")}));
      }catch(e){ if(e.silent) return } finally{ noteBusy=false; busy(b,false) }
    }
    if(!parts){ if(units.length<=7) parts=units.map(u=>({title:"",memo:u}));
      else { const k=5, per=Math.ceil(units.length/k); parts=[]; for(let j=0;j<units.length;j+=per) parts.push({title:"",memo:units.slice(j,j+per).join("\n")}) } }
  }
  const per=r100(total/parts.length);
  n.secs=parts.map(p=>newSec({title:p.title,memo:p.memo,words:per})); n.divided=true;
  save(); keepScroll(render); toast(`${parts.length}단계로 나눴어요`,1400);
}

  noteBusy=true; busy(b,true);

    const o=await aiJSON(`2차 창작 소설의 전개 단계를 구체적인 장면으로 펼쳐줘.\n\n${planCtx()}\n\n[분량] 전체 약 ${padTotal().toLocaleString()}어절\n\n[단계 — 작가의 메모]\n${n.secs.map((s,i)=>`${i+1}. ${s.title||"(이름 없음)"}${s.memo.trim()?`: ${s.memo.trim()}`:""}`).join("\n")}\n\n규칙:\n- 단계 수(${n.secs.length})와 순서를 그대로 지켜.\n- detail은 그 단계에서 실제로 일어나는 구체적인 사건 1~2문장. 메모의 의도를 살리고 인물 이름을 써. 앞뒤 단계와 인과로 이어지게.\n- title은 2~8자. 이미 이름이 있으면 그대로.\n- 꼭 넣을 장면이 있으면 가장 어울리는 단계에 넣어.`,
      {type:"OBJECT",properties:{steps:ARR({title:{type:"STRING"},detail:{type:"STRING"}},["title","detail"])},required:["steps"]});
    const st=o.steps||[]; if(!st.length) throw new Error("펼치지 못했어요. 다시 눌러주세요.");
    n.secs.forEach((s,i)=>{ const x=st[i]; if(!x) return; s.ai=String(x.detail||"").trim(); if(!s.title.trim()) s.title=String(x.title||"").trim().slice(0,20) });
    save(); keepScroll(render);
  }catch(e){ errToast(e) } finally{ noteBusy=false; busy(b,false) }
}
async function regenSec(i,instr,b){
  const n=pad(), s=n.secs[i]; if(!s) return false;
  busy(b,true);
  try{
    const list=n.secs.map((x,j)=>`${j+1}. ${x.title||"(이름 없음)"}${x.memo.trim()?` — 메모: ${x.memo.trim()}`:""}${x.ai?` — 장면: ${x.ai}`:""}`).join("\n");
    const o=await aiJSON(`2차 창작 소설의 전개 중 ${i+1}단계 하나만 다시 구체화해줘.\n\n${planCtx()}\n\n[전체 단계]\n${list}\n\n[다시 쓸 단계] ${i+1}. ${s.title||"(이름 없음)"}${s.memo.trim()?`\n작가의 메모: ${s.memo.trim()}`:""}${s.ai?`\n지금 장면: ${s.ai}`:""}${instr?`\n\n[지시]\n${instr}`:""}\n\n규칙: detail은 이 단계에서 실제로 일어나는 구체적인 사건 1~2문장. 작가의 메모를 살리되 지금 장면과는 다르게, 앞뒤 단계와 인과로 이어지게. title은 2~8자.`,
      {type:"OBJECT",properties:{title:{type:"STRING"},detail:{type:"STRING"}},required:["title","detail"]});
    if(o.detail) s.ai=String(o.detail).trim(); if(!s.title.trim()&&o.title) s.title=String(o.title).trim().slice(0,20); save();
    if(!document.querySelector(".scrim")) keepScroll(render);
    return true;
  }catch(e){ errToast(e); return false } finally{ busy(b,false) }
}
function secSheet(i){
  const n=pad(), s=n.secs[i]; if(!s) return; const dv=n.divided;
  const sh=sheet(`<div class="shh"><b>${dv?`${i+1}단계`:"메모"}</b><button class="x" data-x="close" aria-label="닫기">${ic("x")}</button></div>
    ${dv?`<input class="shin" id="ssT" value="${esc(s.title)}" placeholder="단계 이름" autocomplete="off">`:""}
    <div class="shl">내 메모</div><textarea class="shta" id="ssM" rows="1">${esc(s.memo)}</textarea>
    <div class="shl">AI 장면</div><textarea class="shta" id="ssA" rows="1">${esc(s.ai)}</textarea>
    <div class="askrow"><input id="ssI" placeholder="지시" autocomplete="off"><button data-x="ask" aria-label="다시 펼치기">${ic("send")}</button></div>
    <div class="chips wrap" style="margin-top:14px"><button class="chip" data-x="regen">${ic("redo")}다시 펼치기</button><button class="chip" data-x="clear">AI 장면 지우기</button>${dv&&i>0?`<button class="chip" data-x="merge">위 단계와 합치기</button>`:""}${dv?`<button class="chip" data-x="del" style="color:var(--danger)">삭제</button>`:""}</div>
    <label class="words" style="margin-top:20px"><span>분량</span><input id="ssW" inputmode="numeric" value="${dv?s.words:S.words}" autocomplete="off"><span>어절</span></label>`,
    async(e,close)=>{
      const b=e.target.closest("[data-x]"); if(!b||b.disabled) return; const x=b.dataset.x;
      if(x==="close") close();
      if(x==="ask"||x==="regen"){ const ins=x==="ask"?sh.querySelector("#ssI").value.trim():""; if(x==="ask"&&!ins) return; if(await regenSec(i,ins,b)){ const a=sh.querySelector("#ssA"); a.value=s.ai; growTA(a); if(x==="ask") sh.querySelector("#ssI").value="" } }
      if(x==="clear"){ s.ai=""; const a=sh.querySelector("#ssA"); a.value=""; growTA(a); save() }
      if(x==="merge"){ const p=n.secs[i-1]; p.memo=[p.memo.trim(),s.memo.trim()].filter(Boolean).join("\n"); p.ai=[p.ai,s.ai].filter(Boolean).join(" "); p.words=(+p.words||0)+(+s.words||0); n.secs.splice(i,1); if(n.secs.length===1){ n.divided=false; S.words=Math.min(WMAX,Math.max(WMIN,n.secs[0].words)) } save(); close() }
      if(x==="del"){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="한 번 더 누르면 삭제"; return }
        n.secs.splice(i,1); if(n.secs.length===1){ n.divided=false; S.words=Math.min(WMAX,Math.max(WMIN,n.secs[0].words)) } save(); close() }
    },()=>{ save(); keepScroll(render) });
  const t=sh.querySelector("#ssT"), m=sh.querySelector("#ssM"), a=sh.querySelector("#ssA"), w=sh.querySelector("#ssW");
  [m,a].forEach(growTA);
  t?.addEventListener("input",()=>{ s.title=t.value; save() });
  m.addEventListener("input",()=>{ s.memo=m.value; growTA(m); save() });
  a.addEventListener("input",()=>{ s.ai=a.value; growTA(a); save() });
  sh.querySelector("#ssI").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); sh.querySelector('[data-x="ask"]').click() } });
  w.addEventListener("input",()=>{ w.value=w.value.replace(/[^0-9]/g,"").slice(0,5) });
  w.addEventListener("change",()=>{ let v=+w.value||0; if(dv){ v=Math.min(WMAX,Math.max(100,v||s.words)); s.words=v } else { v=Math.min(WMAX,Math.max(WMIN,v||S.words)); S.words=v } w.value=v; save() });
}

const MEMO_PH="원작: 푸른 등대 (원작 4권 이후 시점)\n주연: 서하윤, 한도겸\n서하윤 — 등대지기 견습생. 말수가 적고 계산적.\n한도겸 — 표류해 온 기상학자. 능청스럽고 다정함.\n호칭: 하윤 → 도겸 \"선배\" / 도겸 → 하윤 \"서하윤\"\n말투: 둘 다 반말.\n배경: 1990년대 남해의 작은 섬.\n금지: 원작에서 죽은 인물 등장 금지.";
function memoEditor(w,isNew){
  push({title:"",memo:true,html:()=>`
    <input class="memo-name" id="m_name" value="${esc(w.name)}" placeholder="작품 이름" autocomplete="off">

function renderEditor(ed){
  if(ed.memo){ const prev=stack.length>1?"뒤로":(tab==="setbook"?"설정집":"뒤로");
    return `<section class="view"><div class="head">${backBtn(prev,'data-act="edback"')}<button class="textbtn" data-act="edback">완료</button></div><div class="scroll">${ed.html()}</div></section>` }
  return `<section class="view"><div class="head" style="padding-left:10px;padding-right:14px"><button class="icon" data-act="edback" aria-label="뒤로">${ic("back")}</button><div style="font-weight:700;font-size:16px;flex:1;text-align:center">${esc(ed.title)}</div>${ed.noSave?'<span style="width:40px"></span>':`<button class="textbtn" data-act="edsave">저장</button>`}</div>
  <div class="scroll">${ed.html()}</div></section>`;
}
function push(ed){ stack.push(ed); render(); if(!ed.rebind) setTimeout(()=>ed.after?.(),0) }
function pop(){ const ed=stack.pop(); ed?.leave?.(); render(); const top=stack[stack.length-1]; if(top&&!top.rebind) setTimeout(()=>top.after?.(),0) }

function fieldEditor(title,fields,onSave,extra){
  push({title,html:()=>fields.map(f=>`<div class="field"><label for="f_${f.k}">${f.l}</label>${f.multi?`<textarea id="f_${f.k}" placeholder="${esc(f.ph||"")}" style="min-height:${f.h||220}px">${esc(f.v||"")}</textarea>`:`<input id="f_${f.k}" placeholder="${esc(f.ph||"")}" value="${esc(f.v||"")}" autocomplete="off">`}${f.hint?`<p class="hint">${f.hint}</p>`:""}</div>`).join("")+(extra||""),
    save:()=>{ const o={}; fields.forEach(f=>o[f.k]=app.querySelector("#f_"+f.k).value); return onSave(o) }});
}

async function runGen(p,dest){
  if(!S.apiKey||!S.model){ toast("설정에서 Gemini API 키와 모델을 먼저 연결해주세요",3200); tab="prefs"; stack=[]; render(); setTimeout(geminiEditor,50); return }
  const ctrl=new AbortController(), multi=p.split||(!p.chunks&&p.target>CHUNK*1.3);
  gen={ctrl,text:"",p,dest,target:p.target,round:1,extra:"",multi};
  openLive(multi);
  let maxOut=Math.min(S.modelOut||65536,65536);
  const maxRounds=Math.min(15,Math.ceil(p.target/CHUNK)+3);
  let note=null;
  try{
    S.primeCache ||= {};
    let ack=S.primeCache[p.h];
    if(!ack){
      gen.phase="prime"; updateLive();
      const pr=await streamOnce({systemInstruction:{parts:[{text:SYS_SHORT}]},contents:[{role:"user",parts:[{text:p.setup}]}],generationConfig:{temperature:0.4,maxOutputTokens:4096}},ctrl,()=>{});
      ack=(pr.out||"").trim()||"준비됐어요.";
      const keys=Object.keys(S.primeCache); if(keys.length>=8) delete S.primeCache[keys[0]];
      S.primeCache[p.h]=ack; save();
    }
    gen.phase="write"; updateLive();
    const contents=[{role:"user",parts:[{text:p.setup}]},{role:"model",parts:[{text:ack}]},{role:"user",parts:[{text:p.request}]}];
    const rounds=p.chunks?p.chunks.length:maxRounds; gen.steps=p.split?p.chunks.length:0;
    for(let round=1;round<=rounds;round++){
      gen.round=round; updateLive();
      const base=gen.text;
      let res;
      try{
        res=await streamOnce({systemInstruction:{parts:[{text:SYS_SHORT}]},contents,generationConfig:{temperature:S.temperature,maxOutputTokens:maxOut}},ctrl,out=>{ gen.text=round===1?out:joinParts(base,out); updateLive() });
      }catch(e){
        if(e.status===400&&/max.?output.?tokens|maxOutputTokens/i.test(e.raw||"")&&maxOut>8192){ maxOut=8192; round--; continue }
        throw e;
      }
      if(!res.out.trim()){
        if(round===1) throw new Error(res.block?"요청이 Gemini 안전 정책에 걸려 거절됐어요. 표현을 바꿔 다시 시도해주세요.":(res.finish==="SAFETY"||res.finish==="PROHIBITED_CONTENT")?"Gemini가 안전 정책 때문에 쓰기를 멈췄어요. 표현을 바꿔 다시 시도해주세요.":"Gemini가 빈 답을 보냈어요. 다시 시도해주세요.");
        break;
      }
      if(res.finish==="SAFETY"||res.finish==="PROHIBITED_CONTENT"){ note="안전 정책 때문에 중간에 멈췄어요"; break }
      const have=wordCount(gen.text), ex=gen.extra;
      if(p.chunks){ if(round===rounds) break; gen.extra=""; liveChips(); contents.push({role:"model",parts:[{text:res.out}]}); contents.push({role:"user",parts:[{text:chunkPrompt(round,p,have,ex)}]}); continue }
      if(have>=p.target*0.95) break;
      if(round===maxRounds){ note=`목표보다 짧게 끝났어요 (${have.toLocaleString()}어절)`; break }
      gen.extra=""; liveChips();
      contents.push({role:"model",parts:[{text:res.out}]});
      contents.push({role:"user",parts:[{text:contPrompt(have,p.target,ex)}]});
    }
    finishGen(note);
  }catch(e){
    if(e.name==="AbortError"){ if(gen.text.trim().length>100) finishGen("중간에 멈췄어요"); else { gen=null; closeLive(); toast("멈췄어요") } return }
    if(gen.text.trim().length>300){ finishGen("연결이 끊겨 중간까지만 저장했어요") }
    else { gen=null; closeLive(); toast(e.message==="Failed to fetch"?"인터넷 연결을 확인해주세요":e.message,4500) }
  }
}
function apiErr(st,m){
  if(st===400&&/API key/i.test(m)) return "API 키가 맞지 않아요. 설정에서 다시 확인해주세요.";
  if(st===403) return "이 API 키로는 해당 모델을 쓸 수 없어요. 설정에서 다른 모델을 골라주세요.";
  if(st===404) return "모델을 찾을 수 없어요. 설정에서 모델 목록을 다시 불러와주세요.";
  if(st===429) return "요청 한도를 넘었어요. 잠시 뒤 다시 쓰거나, 무료 한도라면 Flash 모델을 골라주세요.";
  if(st>=500) return "Gemini 서버가 응답하지 않아요. 잠시 뒤 다시 시도해주세요.";

}
function splitTitle(text){
  const m=text.match(/^\s*#{1,3}\s*(.+?)\s*\n/)||text.match(/^\s*\**\s*제목\s*[:：]\s*(.+?)\s*\**\s*\n/)||text.match(/^\s*\*\*([^*\n]{1,40})\*\*\s*\n/);
  if(m) return {title:m[1].replace(/[*_]/g,"").trim(),body:text.slice(m[0].length)};
  return {title:"",body:text};
}

/* ───────── 본문 → HTML ───────── */
function bodyHTML(text){
  return text.replace(/\r/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    if(/^(\*\s*){3,}$|^[＊*]{1,3}$|^-{3,}$|^◇+$|^#\s*$/.test(l)) return `<p class="brk">＊＊＊</p>`;
    const h=l.match(/^#{1,4}\s*(.+)$/); if(h) return `<h2>${esc(h[1].replace(/[*_]/g,""))}</h2>`;
    return `<p>${esc(l).replace(/\*\*(.+?)\*\*/g,"$1").replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,"$1$2")}</p>`;
  }).join("");
}

/* ───────── 회차 나누기 (단계별 어절 기준, 약 CHUNK씩) ───────── */
function planChunks(steps){
  const n=steps.length, total=steps.reduce((a,x)=>a+x.w,0);
  if(!n||total<=CHUNK*1.3) return [{s:0,e:Math.max(0,n-1),w:total,sp:false,ep:false}];
  const B=[0]; steps.forEach(x=>B.push(B[B.length-1]+x.w));
  const k=Math.max(1,Math.round(total/CHUNK)), cuts=[0], tol=Math.min(500,CHUNK*0.15);
  for(let j=1;j<k;j++){ const pos=j*total/k, lastC=cuts[cuts.length-1]; let best=pos, bd=Infinity;
    for(const b of B){ const dd=Math.abs(b-pos); if(dd<=tol&&dd<bd&&b>lastC&&b<total){ best=b; bd=dd } }
    if(best>lastC) cuts.push(best) }
  cuts.push(total);
  const on=x=>B.some(b=>Math.abs(b-x)<1e-6), idxAt=x=>{ let i=0; while(i<n-1&&B[i+1]<=x+1e-6) i++; return i };
  const out=[];
  for(let j=0;j<cuts.length-1;j++){ const a=cuts[j], b=cuts[j+1]; if(b-a<1) continue;
    out.push({s:idxAt(a),e:idxAt(b-1e-3),w:Math.round(b-a),sp:!on(a),ep:!on(b)}) }
  return out;
}
function rnd(n){ return Math.max(100,Math.round(n/100)*100).toLocaleString() }
function chunkText(c,write,idx,total,ending){
  const last=idx===total-1, nm=i=>`${write[i].num}단계(${write[i].k})`;
  let range;
  if(c.s===c.e) range=`전개 ${nm(c.s)}${c.sp&&c.ep?"의 중간 부분":c.sp?"의 남은 부분":c.ep?"의 앞부분":""}`;
  else range=`전개 ${nm(c.s)}${c.sp?"의 남은 부분":""}부터 ${nm(c.e)}${c.ep?"의 중반":""}까지`;
  const lc=range.replace(/\)$/,"").slice(-1).charCodeAt(0), obj=lc>=0xAC00&&lc<=0xD7A3&&(lc-0xAC00)%28?"을":"를";
  let t=total>1?`이번 응답(${idx+1}/${total}번째)에서는 ${range}${obj} 약 ${rnd(c.w)}어절로 써줘. 각 단계 분량은 위 [전개]의 어절 수를 따라줘.`:`이번에는 ${range}${obj} 약 ${rnd(c.w)}어절로 써줘.`;
  if(last) t+=ending?" 여기서 이야기를 마무리하고 중심 소재를 결말에서 회수해줘.":" 이야기는 다음 단계로 이어지니 결말을 쓰지 말고, 이 단계가 끝나는 곳에서 멈춰.";
  else if(c.ep) t+=` ${nm(c.e)}의 나머지는 다음 응답에서 이어 쓸 테니, 장면이 이어지는 곳에서 자연스럽게 멈춰.`;
  else t+=` ${nm(c.e+1)}은(는) 아직 쓰지 말고, 장면이 이어지는 곳에서 자연스럽게 멈춰.`;
  return t;
}
function chunkPrompt(idx,p,have,extra){
  return `지금까지 이번 본문 ${have.toLocaleString()}어절을 썼어. 방금 쓴 마지막 문장 바로 다음부터 그대로 이어서 써줘. 제목, 요약, 앞 내용 반복, 인사말 없이 본문만. 새 단계를 시작할 때는 "## 번호. 단계 이름" 줄을 써.\n`+chunkText(p.chunks[idx],p.write,idx,p.chunks.length,p.ending)+(extra?`\n\n[추가 지시]\n${extra}`:"");

/* ───────── 단계 표시 줄 ↔ 이야기 구조 ───────── */
const MARK_RE=/^(#{1,4})?\s*\**\s*(\d{1,2})\s*(?:단계)?\s*[.)·:\-]?\s*(.{0,30}?)\s*\**\s*$/;
const normK=t=>(t||"").replace(/[\s*#_.·:()\-]/g,"");
function markerNum(line,write){
  line=(line||"").trim(); if(!line||line.length>40) return 0; const m=line.match(MARK_RE); if(!m) return 0;
  const num=+m[2], st=write.find(x=>x.num===num); if(!st) return 0;
  const rest=normK(m[3]), k=normK(st.k);
  if(m[1]||!rest||(k&&(rest.includes(k.slice(0,4))||k.includes(rest.slice(0,4))))) return num;
  return 0;
}
function titleOf(text,write){
  const m=text.match(/^\s*#{1,3}\s*(.+?)\s*\n/);
  if(m&&markerNum(m[0],write||[])) return {title:"",body:text};
  return splitTitle(text);
}
function splitByMarkers(text,write){
  const out={}; let cur=write[0]?.num||1, ci=0;
  for(const line of text.split("\n")){
    const n=markerNum(line,write), ni=n?write.findIndex(x=>x.num===n):-1;
    if(n&&ni>=ci){ cur=n; ci=ni; out[cur]=out[cur]||""; continue }
    out[cur]=(out[cur]||"")+line+"\n";
  }
  for(const k in out) out[k]=out[k].replace(/^\s+|\s+$/g,"");
  return out;
}
function syncText(s){
  const multi=s.secs.length>1;
  s.text=s.secs.map((x,i)=>!(x.text||"").trim()?"":multi?`## ${i+1}. ${(x.title||"").trim()||"단계 "+(i+1)}\n\n${x.text.trim()}`:x.text.trim()).filter(Boolean).join("\n\n");
}
function ensureSecs(s){
  if(s.secs?.length) return s.secs;
  const st=s.plot?.steps;
  if(st?.length>1){ const write=st.map((x,i)=>({num:i+1,k:x.k||""})), parts=splitByMarkers(s.text||"",write);
    if(Object.keys(parts).length>=2){ s.secs=st.map((x,i)=>({title:x.k||"",words:r100(wc(parts[i+1])||100),memo:"",ai:x.d||"",text:parts[i+1]||"",chk:false})); return s.secs } }
  s.secs=[{title:"",words:r100(wc(s.text)||100),memo:"",ai:"",text:s.text||"",chk:false}];
  return s.secs;
}

  if(a&&a.classList?.contains("edta")&&a.selectionEnd>a.selectionStart){
    ED.sel={i:+a.dataset.i,start:a.selectionStart,end:a.selectionEnd,text:a.value.slice(a.selectionStart,a.selectionEnd)}; bar.hidden=false }
  else if(!document.querySelector(".scrim")) bar.hidden=true;
}
function edApply(sel,v){
  const s=ED.s, sec=s.secs[sel.i]; let at=sel.start;
  if((sec.text||"").slice(sel.start,sel.end)!==sel.text){ at=(sec.text||"").indexOf(sel.text); if(at<0){ toast("본문이 바뀌어 적용하지 못했어요"); return } }
  ED.hist.push({i:sel.i,before:sec.text}); sec.text=sec.text.slice(0,at)+v+sec.text.slice(at+sel.text.length);
  syncText(s); s.editedAt=Date.now(); save(); ED.sel=null; edRefresh(); toast("적용했어요",1000);
}
function rewriteSheet(mode){
  const sel=ED?.sel; if(!sel||!sel.text.trim()) return;
  const [label,base]=RW[mode]; let opts=[], k=0, running=false;
  const sh=sheet(`<div class="shh"><b>${label}</b><button class="x" data-x="close" aria-label="닫기">${ic("x")}</button></div>
    <div class="shl">원래</div><div class="rworig">${esc(sel.text)}</div>
    <div class="shl"><span id="rwN">제안</span></div><textarea class="rwbox" id="rwBox" readonly rows="2"></textarea>
    <div class="chips" style="margin-top:10px"><button class="chip" data-x="prev">‹ 이전</button><button class="chip" data-x="next">다음 ›</button><button class="chip" data-x="edit">${ic("pen")}고쳐서 적용</button></div>
    <div class="askrow"><input id="rwIns" placeholder="더 짧게, 담담하게…" autocomplete="off"><button data-x="ask" aria-label="보내기">${ic("send")}</button></div>
    <button class="btnfull" data-x="apply" style="margin-top:14px" disabled>${ic("check")}적용</button>`,
    (e,close)=>{
      const b=e.target.closest("[data-x]"); if(!b||b.disabled) return; const x=b.dataset.x;
      if(x==="close") close();
      if((x==="prev"||x==="next")&&opts.length){ k=(k+(x==="next"?1:-1)+opts.length)%opts.length; show() }
      if(x==="edit"&&opts.length){ box.readOnly=false; box.focus() }
      if(x==="ask"){ const v=ins.value.trim(); if(!v&&mode==="instr") return; run(v) }
      if(x==="apply"){ const v=box.value; if(!v.trim()) return; close(); edApply(sel,v) }
    },()=>{ if(ED) ED.el.querySelector(".selbar").hidden=true });
  const box=sh.querySelector("#rwBox"), ins=sh.querySelector("#rwIns"), ap=sh.querySelector('[data-x="apply"]');
  const show=()=>{ box.readOnly=true; box.value=opts[k]||""; growTA(box); sh.querySelector("#rwN").textContent=opts.length?`제안 ${k+1}/${opts.length}`:"제안"; ap.disabled=!opts.length };
  const run=async extra=>{
    if(running) return; running=true; box.value="…"; ap.disabled=true;
    const sec=ED.s.secs[sel.i], t=sec.text||"", w=S.works.find(x=>x.id===ED.s.workId);
    const prompt=`소설의 일부를 고쳐 쓴다. [고칠 부분]만 대체할 새 텍스트를 서로 다르게 3가지 제안해줘.\n\n${w&&(w.memo||"").trim()?`[작품 설정: ${w.name}]\n${w.memo.trim().slice(0,4000)}\n\n`:""}[앞 문맥]\n${t.slice(Math.max(0,sel.start-1500),sel.start)}\n\n[고칠 부분]\n${sel.text}\n\n[뒤 문맥]\n${t.slice(sel.end,sel.end+800)}\n\n[방법]\n${[base,extra].filter(Boolean).join("\n")}\n\n규칙: 앞뒤 문맥과 자연스럽게 이어지게. 문단 구분과 대사의 큰따옴표 형식은 유지. 고칠 부분을 대신할 텍스트만 쓰고 설명은 쓰지 마.`;
    try{ const o=await aiJSON(prompt,{type:"OBJECT",properties:{options:{type:"ARRAY",items:{type:"STRING"}}},required:["options"]},{temp:Math.max(0.9,S.temperature)});
      opts=(o.options||[]).map(v=>String(v).trim()).filter(Boolean).slice(0,3); k=0;
      if(!opts.length) throw new Error("제안을 만들지 못했어요. 다시 시도해주세요."); show(); ins.value="" }
    catch(e){ box.value=opts[k]||""; ap.disabled=!opts.length; errToast(e) } finally{ running=false }
  };
  ins.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); sh.querySelector('[data-x="ask"]').click() } });
  if(mode==="instr") setTimeout(()=>ins.focus(),50); else run("");
}

let RV=null;
async function runRevise(s,cfg,sel){
  if(!needApi("퇴고는 Gemini API를 써요. 설정 › API 연결에서 키와 모델을 넣어주세요")) return;
  const secs=s.secs, units=[];
  if(cfg.scope==="sel"&&sel) units.push({sec:sel.i,text:sel.text});
  else { const idx=cfg.scope==="step"?[...cfg.pick].sort((a,b)=>a-b):secs.map((_,i)=>i);
    for(const i of idx){ const t=secs[i].text||""; if(!t.trim()) continue; let buf="";
      for(const para of t.split(/(?<=\n)/)){ if(buf.length+para.length>9000&&buf.trim()){ units.push({sec:i,text:buf}); buf="" } buf+=para }
      if(buf.trim()) units.push({sec:i,text:buf}) } }
  if(!units.length){ toast("퇴고할 본문이 없어요"); return }
  const ctrl=new AbortController();
  S.revise={storyId:s.id,edits:[]}; save();
  openRevise(s.id,{busy:true,done:0,total:units.length,ctrl});
  const opts=RV_OPTS.filter(o=>cfg.opts.has(o[0])), labels=opts.map(o=>o[1]);
  const w=S.works.find(x=>x.id===s.workId), ins=(cfg.ins||"").trim();
  for(let u=0;u<units.length;u++){
    const un=units[u];
    const prompt=`너는 한국어 소설 편집자야. 아래 [본문]을 퇴고해서 고칠 곳을 목록으로 줘.\n\n${w&&(w.memo||"").trim()?`[설정집: ${w.name}]\n${w.memo.trim().slice(0,5000)}\n\n`:""}[신경 쓸 부분]\n${opts.map(o=>`- ${o[1]}: ${o[3]}`).join("\n")}\n\n[강도]\n${cfg.str} — ${RV_STR[cfg.str]}${ins?`\n\n[따로 부탁]\n${ins}`:""}\n\n[본문]\n${un.text}\n\n규칙:\n- find는 [본문]에서 글자 하나 바꾸지 않고 그대로 복사한 연속된 구간이야. 한 문장 안에서, 고칠 부분을 포함하되 짧게(보통 10~120자). 줄바꿈을 넣지 마.\n- replace는 find를 대신할 새 텍스트. 줄바꿈 없이. find와 같으면 안 돼.\n- why는 고친 이유를 20자 안팎으로.\n- cat은 [신경 쓸 부분]의 이름 중 하나를 그대로.\n- 같은 곳을 두 번 고치지 마. 고칠 곳이 없으면 빈 목록.`;
    try{
      const o=await aiJSON(prompt,{type:"OBJECT",properties:{edits:ARR({cat:{type:"STRING"},find:{type:"STRING"},replace:{type:"STRING"},why:{type:"STRING"}},["cat","find","replace","why"])},required:["edits"]},{temp:0.3,signal:ctrl.signal});
      const t=secs[un.sec].text||"";
      for(const e of o.edits||[]){
        const f=String(e.find||""), r=String(e.replace||"");
        if(!f.trim()||f===r||/\n/.test(f)||/\n/.test(r)||!t.includes(f)) continue;
        if(S.revise.edits.some(x=>x.sec===un.sec&&(x.find.includes(f)||f.includes(x.find)))) continue;
        const c=String(e.cat||""), cat=labels.find(l=>l===c)||labels.find(l=>c&&(l.includes(c)||c.includes(l.slice(0,2))))||labels[0];
        S.revise.edits.push({id:uid(),cat,sec:un.sec,find:f,replace:r,why:String(e.why||"").trim(),st:"new",pos:t.indexOf(f)});
      }
    }catch(e){ if(e.name==="AbortError") break; errToast(e); break }
    S.revise.edits.sort((a,b)=>a.sec-b.sec||a.pos-b.pos);
    save(); if(RV&&RV.id===s.id){ RV.done=u+1; rvDraw() }
  }
  if(RV&&RV.id===s.id){ RV.busy=false; if(!RV.cur) RV.cur=S.revise.edits.find(e=>e.st==="new")?.id||null; rvDraw() }
}
function openRevise(id,st){
  document.querySelector(".rvw")?.remove();
  const el=document.createElement("div"); el.className="rvw"; document.body.appendChild(el);
  RV={id,el,view:"list",filter:"all",cur:null,editing:null,...st};
  el.addEventListener("click",rvClick); rvDraw();
}
function closeRevise(){ if(!RV) return; RV.ctrl?.abort(); RV.el.remove(); const id=RV.id; RV=null; refreshViews(id) }
function rvEdits(){ return S.revise?.storyId===RV.id?S.revise.edits:[] }
function rvLocate(t,f,hint){
  if(!f) return -1; if(hint>=0&&t.substr(hint,f.length)===f) return hint;
  let p=t.indexOf(f), best=p; while(p>=0){ if(Math.abs(p-(hint||0))<Math.abs(best-(hint||0))) best=p; p=t.indexOf(f,p+1) } return best;
}
function rvShift(e,p,d){ for(const x of S.revise.edits) if(x!==e&&x.sec===e.sec){ if(x.st!=="applied"&&x.pos>p) x.pos+=d; if(x.st==="applied"&&x.at>p) x.at+=d } }
function rvApply(e,txt){
  const s=S.stories.find(x=>x.id===RV.id), sec=s?.secs[e.sec]; if(!sec) return false; if(txt!=null) e.replace=txt.replace(/\n+/g," ");
  const t=sec.text||"", p=rvLocate(t,e.find,e.pos);
  if(p<0){ e.st="skipped"; toast("본문이 바뀌어 적용하지 못했어요",1800); save(); return false }
  sec.text=t.slice(0,p)+e.replace+t.slice(p+e.find.length); e.at=p; e.st="applied"; rvShift(e,p,e.replace.length-e.find.length);
  syncText(s); s.editedAt=Date.now(); save(); return true;
}
function rvRevert(e){
  const s=S.stories.find(x=>x.id===RV.id), sec=s?.secs[e.sec]; if(!sec) return;
  const t=sec.text||"", p=rvLocate(t,e.replace,e.at);
  if(p<0){ toast("본문이 바뀌어 되돌리지 못했어요",1800); return }
  sec.text=t.slice(0,p)+e.find+t.slice(p+e.replace.length); e.st="new"; e.pos=p; rvShift(e,p,e.find.length-e.replace.length);
  syncText(s); save();
}
function rvNext(){
  const E=rvEdits(), pend=E.filter(e=>e.st==="new"); if(!pend.length){ RV.cur=null; return }
  const i=E.findIndex(e=>e.id===RV.cur);
  RV.cur=(E.slice(i+1).find(e=>e.st==="new")||pend[0]).id;
}
function rvBodyHTML(s,E){
  const multi=s.secs.length>1;
  return s.secs.map((x,i)=>{ const t=x.text||""; if(!t.trim()) return "";
    const rs=[];
    for(const e of E){ if(e.sec!==i) continue;
      if(e.st==="new"){ const p=rvLocate(t,e.find,e.pos); if(p>=0) rs.push({a:p,b:p+e.find.length,e,k:"new"}) }
      else if(e.st==="applied"){ const p=rvLocate(t,e.replace,e.at); if(p>=0) rs.push({a:p,b:p+e.replace.length,e,k:"ok"}) } }
    rs.sort((a,b)=>a.a-b.a); let out="", last=0;
    for(const r of rs){ if(r.a<last) continue; out+=esc(t.slice(last,r.a)); const seg=esc(t.slice(r.a,r.b));
      out+=r.k==="ok"?`<span class="ok">${seg}</span>`:r.e.id===RV.cur?`<mark class="cur" data-id="${r.e.id}"><del>${seg}</del> <ins>${esc(r.e.replace)}</ins></mark>`:`<mark data-id="${r.e.id}">${seg}</mark>`;
      last=r.b }
    out+=esc(t.slice(last));
    return (multi?`<div class="esec"><span>${i+1} · ${esc((x.title||"").trim()||"단계 "+(i+1))}</span><i></i></div>`:"")+out.split(/\n+/).map(l=>l.trim()?(/^(\*\s*){3,}$|^[＊*]{1,3}$/.test(l.trim())?`<p class="brk">＊＊＊</p>`:`<p>${l}</p>`):"").join("");
  }).join("");
}
function rvDraw(){
  if(!RV) return; const s=S.stories.find(x=>x.id===RV.id); if(!s){ closeRevise(); return }
  const E=rvEdits(), el=RV.el, multi=s.secs.length>1;

      <div class="acts">${e.st==="applied"?`<button class="chip on" data-a="noop">${ic("check")}적용됨</button><button class="chip" data-a="revert">되돌리기</button>`:e.st==="skipped"?`<button class="chip" data-a="unskip">건너뜀</button>`:`<button class="chip on" data-a="apply">적용</button><button class="chip" data-a="skip">건너뛰기</button>${RV.editing===e.id?"":`<button class="chip" data-a="edit">${ic("pen")}고쳐서</button>`}`}</div></div>`;
    el.innerHTML=`<div class="etop"><button class="icon" data-v="close" aria-label="닫기">${ic("back")}</button><div class="ttl">퇴고 결과</div><button class="textbtn" data-v="all" ${left?"":"disabled"}>모두 적용</button></div>
      ${busyRow}
      ${E.length?`<div class="chips rvf"><button class="chip ${RV.filter==="all"?"on":""}" data-f="all">전체 ${E.length}</button>${cats.map(c=>`<button class="chip ${RV.filter===c?"on":""}" data-f="${esc(c)}">${esc(short(c))} ${E.filter(e=>e.cat===c).length}</button>`).join("")}</div>`:""}
      <div class="rvlist">${fl.length?fl.map(card).join(""):(RV.busy?"":`<div class="empty">고칠 곳을 찾지 못했어요</div>`)}</div>
      <div class="rvfoot"><span>적용 ${ap} · 남은 ${left}</span><button class="chip" data-v="body" ${E.length?"":"disabled"}>본문에서 보기</button></div>`;
    el.querySelector(".rvlist").scrollTop=y;
  } else {
    if(!E.some(e=>e.id===RV.cur&&e.st==="new")) rvNext();
    const ce=E.find(e=>e.id===RV.cur), ci=E.indexOf(ce);
    const y=el.querySelector(".rvbody")?.scrollTop;
    el.innerHTML=`<div class="etop"><button class="icon" data-v="list" aria-label="목록">${ic("back")}</button><div class="ttl">${esc(s.title)}</div><span style="width:40px"></span></div>
      ${busyRow}
      <div class="rvbody">${rvBodyHTML(s,E)}</div>
      ${ce?`<div class="rvcur"><div class="k">${esc(ce.cat)}</div>${ce.why?`<div class="w">${esc(ce.why)}</div>`:""}<div class="acts"><button class="chip on" data-a="apply" data-id="${ce.id}">적용</button><button class="chip" data-a="skip" data-id="${ce.id}">건너뛰기</button><button class="chip" data-v="next" style="margin-left:auto">다음 ›</button></div></div>`:""}
      <div class="rvfoot"><span>${ce?`퇴고 ${ci+1} / ${E.length}`:`적용 ${ap} · 남은 ${left}`}</span><span style="display:flex;gap:8px"><button class="chip" data-v="list">목록</button><button class="chip on" data-v="all" ${left?"":"disabled"}>모두 적용</button></span></div>`;
    const b=el.querySelector(".rvbody"), m=b.querySelector("mark.cur");
    if(RV.scrollCur&&m){ b.scrollTop=Math.max(0,m.offsetTop-b.clientHeight*0.3) } else if(y!=null) b.scrollTop=y;
    RV.scrollCur=false;
  }
}
function rvClick(ev){
  const t=ev.target, E=rvEdits();
  const f=t.closest("[data-f]"); if(f){ RV.filter=f.dataset.f; rvDraw(); return }
  const mk=t.closest("mark[data-id]"); if(mk){ RV.cur=mk.dataset.id; rvDraw(); return }
  const vb=t.closest("[data-v]"); const v=vb&&!vb.disabled?vb.dataset.v:null;
  if(v==="close"){ closeRevise(); return }
  if(v==="stop"){ RV.ctrl?.abort(); RV.busy=false; rvDraw(); return }
  if(v==="all"){ E.filter(e=>e.st==="new").forEach(e=>rvApply(e)); toast("모두 적용했어요",1200); rvDraw(); return }
  if(v==="body"){ RV.view="body"; RV.cur=E.find(e=>e.st==="new")?.id||null; RV.scrollCur=true; rvDraw(); return }
  if(v==="list"){ RV.view="list"; rvDraw(); return }
  if(v==="next"){ rvNext(); RV.scrollCur=true; rvDraw(); return }
  const a=t.closest("[data-a]"); if(!a) return;
  const id=a.dataset.id||a.closest("[data-id]")?.dataset.id, e=E.find(x=>x.id===id); if(!e) return; const k=a.dataset.a;
  if(k==="apply"){ const ta=RV.el.querySelector(`.rvcard[data-id="${id}"] .rved`); rvApply(e,ta?ta.value:null); RV.editing=null; if(RV.view==="body"){ rvNext(); RV.scrollCur=true } }
  else if(k==="skip"){ e.st="skipped"; RV.editing=null; save(); if(RV.view==="body"){ rvNext(); RV.scrollCur=true } }
  else if(k==="unskip"){ e.st="new"; save() }
  else if(k==="revert") rvRevert(e);
  else if(k==="edit") RV.editing=id;
  else return;
  rvDraw(); if(k==="edit"){ const ta=RV.el.querySelector(".rved"); if(ta){ growTA(ta); ta.focus() } }
}

/* ───────── 붙여넣기 모드 ───────── */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true }catch(_){
    const ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); let ok=false; try{ ok=document.execCommand("copy") }catch(_){} ta.remove(); return ok }
}
function sendToApp(p,dest){
  const primed=S.lastPrimedH===p.h;
  const {setup,request,...rest}=p;
  S.pending={setup,request,h:p.h,p:rest,dest:dest||{kind:"new"},ci:0,lastW:0,step:primed?2:1,primed,target:p.target,at:Date.now(),draft:""}; save();
  const first=primed?request:setup;
  copyText(first).then(ok=>{ if(ok){ if(primed) S.pending.step=3; else { S.pending.step=2; S.lastPrimedH=p.h } S.pending.copied=primed?"request":"setup"; S.pending.setupCopied=!primed; save() } openPending() });
}
function legacyP(pd){
  const st=[{num:1,k:"",memo:"",d:"",w:pd.target||S.words}];
  return {steps:st,write:st,chunks:null,split:false,target:pd.target||S.words,ending:true,single:true,workId:pd.workId||null,tplName:pd.tplName||"",prevId:pd.prevId||null,meta:pd.meta||null};
}
function openPending(){
  document.querySelector(".pend")?.remove();
  const pd=S.pending; if(!pd) return;
  if(!pd.setup&&pd.prompt){ pd.setup=""; pd.request=pd.prompt; pd.step=3 }
  if(!pd.p){ pd.p=legacyP(pd); pd.dest={kind:"new"} }
  const PC=()=>pd.p.split?pd.p.chunks||[]:[];
  const el=document.createElement("div"); el.className="pend";
  document.body.appendChild(el);
  const draw=()=>{
    const st=pd.step||1;
    const stepRow=(n,title,desc,btn)=>`<div class="pstep ${st===n?"on":st>n?"done":""}"><div class="num">${st>n?ic("check",14):n}</div><div class="bd"><div class="tt">${title}</div><div class="ds">${desc}</div>${btn||""}</div></div>`;
    el.innerHTML=`<div class="head" style="padding-left:10px;padding-right:18px"><button class="icon" data-p="cancel" aria-label="취소">${ic("back")}</button><div style="font-weight:700;font-size:16px;flex:1;text-align:center">Gemini 앱으로 쓰기</div><a class="textbtn" href="https://gemini.google.com/app" target="_blank" rel="noopener" style="font-size:15px;text-decoration:none">Gemini 열기</a></div>
     <div class="scroll" style="display:flex;flex-direction:column">
       <div class="psteps">
         ${pd.setup?stepRow(1,"설정 보내기",
            pd.primed&&st>1?"이전과 같은 설정이라 건너뛰었어요. 새 대화라면 다시 보내주세요.":(pd.setupCopied&&st>1?"복사했어요. Gemini 새 대화에 붙여넣고 '준비됐어요' 답을 기다려요.":"설정과 지침을 먼저 읽혀요. 복사해서 Gemini 새 대화에 붙여넣으세요."),
            `<button class="ghost sm" data-p="setup">${ic("copy")}${st>1?"설정 다시 복사":"설정 복사"}</button>`):""}
         ${stepRow(2,"집필 요청 보내기",
            st>2?(pd.copied==="request"?"복사했어요. 같은 대화에 붙여넣고 답을 기다려요.":"보냈어요."):"Gemini가 '준비됐어요'라고 답하면, 같은 대화에 집필 요청을 붙여넣으세요.",
            `<button class="ghost sm" data-p="request" ${st<2?"disabled":""}>${ic("copy")}${st>2?"요청 다시 복사":"요청 복사"}</button>`)}
         ${stepRow(3,"답 붙여넣기","소설이 다 나오면 답 아래 복사 버튼으로 복사해 와서 붙여넣어요.","")}
       </div>
       <textarea class="pastebox" id="pasteBox" placeholder="Gemini의 답을 여기에 붙여넣기" ${st<3?'style="opacity:.55"':""}>${esc(pd.draft||"")}</textarea>
       <div class="minirow" style="margin-top:12px"><button class="textbtn" data-p="paste">클립보드에서 붙여넣기</button><span id="pcount" style="margin-left:auto;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums"></span></div>
       <div id="pmore" hidden style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
         <div id="pmoreTxt" style="font-size:14px;color:var(--ink2);line-height:1.6"></div>
         <div class="minirow" style="margin-top:12px"><button class="ghost" data-p="contcopy">${ic("copy")}<span id="contLbl">이어 쓰기 요청 복사</span></button><button class="ghost" data-p="append">${ic("plus")}이어 붙이기</button></div>
       </div>
     </div>
     <div class="cta-wrap" style="padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))"><button class="cta" data-p="done" id="pdone">${ic("book")}${pd.dest?.kind==="more"?"이야기에 넣기":"서재에 넣기"}</button></div>`;
    const box=el.querySelector("#pasteBox"), done=el.querySelector("#pdone"), cnt=el.querySelector("#pcount");
    const tgt=pd.target||S.words, more=el.querySelector("#pmore");
    const upd=()=>{ const n=box.value.trim().length, w=wordCount(cleanPaste(box.value)); done.disabled=n<20; cnt.textContent=n?`${w.toLocaleString()} / ${tgt.toLocaleString()}어절`:""; const ch=PC();
      if(!n){ pd.ci=0; pd.lastW=0 } else if(!pd.ci){ pd.ci=1; pd.lastW=w } else if(ch.length&&pd.ci<ch.length&&w-pd.lastW>=ch[pd.ci].w*0.5){ pd.ci++; pd.lastW=w }
      const splitLeft=ch.length&&pd.ci<ch.length;
      more.hidden=!(n>=20&&(splitLeft||w<tgt*0.95));
      el.querySelector("#pmoreTxt").textContent=splitLeft?`${pd.ci}/${ch.length}회차까지 붙여넣었어요. 같은 Gemini 대화에 다음 요청을 보내고, 받은 답을 이어 붙이세요.`:"아직 목표 분량보다 짧아요. 같은 Gemini 대화에 이어 쓰기 요청을 보내고, 받은 답을 이어 붙이세요.";
      el.querySelector("#contLbl").textContent=splitLeft?`${pd.ci+1}회차 요청 복사`:"이어 쓰기 요청 복사";
      pd.draft=box.value; if(n&&pd.step<3) pd.step=3, box.style.opacity=""; save() };
    box.addEventListener("input",upd); upd();
    el._upd=upd; el._box=box;
  };
  draw();
  el.addEventListener("click",async e=>{
    const b=e.target.closest("[data-p]"); if(!b||b.disabled) return; const a=b.dataset.p;
    const box=el._box, upd=el._upd, tgt=pd.target||S.words;
    if(a==="setup"){ if(await copyText(pd.setup)){ pd.copied="setup"; pd.setupCopied=true; pd.primed=false; pd.step=Math.max(pd.step,2); if(pd.step===3&&!box.value.trim()) pd.step=2; S.lastPrimedH=pd.h; save(); draw(); toast("설정을 복사했어요",1400) } else toast("복사하지 못했어요. 다시 눌러주세요") }
    if(a==="request"){ if(await copyText(pd.request)){ pd.copied="request"; pd.step=3; save(); draw(); toast("집필 요청을 복사했어요",1400) } else toast("복사하지 못했어요. 다시 눌러주세요") }
    if(a==="paste"){ try{ const t=await navigator.clipboard.readText(); if(t){ box.value=t; pd.ci=0; upd() } else toast("클립보드가 비어 있어요") }catch(_){ box.focus(); toast("입력칸을 길게 눌러 붙여넣어 주세요",2400) } }
    if(a==="contcopy"){ const w=wordCount(cleanPaste(box.value)), ch=PC();
      const msg=ch.length&&pd.ci<ch.length?chunkPrompt(pd.ci,pd.p,w,""):contPrompt(w,tgt,"");
      toast(await copyText(msg)?"복사했어요. 같은 Gemini 대화에 붙여넣어 주세요":"복사하지 못했어요. 다시 눌러주세요",2600) }
    if(a==="append"){ try{ const t=await navigator.clipboard.readText(); if(!t.trim()){ toast("클립보드가 비어 있어요"); return }
        if(box.value.includes(t.trim().slice(0,80))){ toast("이미 붙여넣은 내용이에요. Gemini의 새 답을 복사해 와주세요",2600); return }
        const ch=PC(); box.value=joinParts(box.value,cleanPaste(t));
        if(ch.length&&pd.ci<ch.length){ pd.ci++; pd.lastW=wordCount(cleanPaste(box.value)) } upd(); box.scrollTop=box.scrollHeight; toast("이어 붙였어요",1200)
      }catch(_){ box.focus(); box.setSelectionRange(box.value.length,box.value.length); box.value=box.value.replace(/\s*$/,"\n\n"); toast("입력칸 맨 끝을 길게 눌러 붙여넣어 주세요",2600) } }
    if(a==="cancel"){
      if(b.dataset.armed!=="1"&&box.value.trim()){ b.dataset.armed="1"; toast("붙여넣은 내용이 있어요. 한 번 더 누르면 취소돼요",2000); return }
      S.pending=null; save(); el.remove(); render() }
    if(a==="done"){
      const raw=box.value.trim(); if(raw.length<20) return;
      if(raw===(pd.setup||"").trim()||raw===(pd.request||"").trim()){ toast("보낸 프롬프트가 붙여넣어졌어요. Gemini의 답을 복사해 와주세요",2800); return }
      if(/준비됐어요\.?\s*$/.test(raw)&&raw.length<400){ toast("설정 확인 답이에요. 집필 요청을 보내고 받은 소설을 붙여넣어 주세요",3000); return }
      gen={text:box.value,p:pd.p,dest:pd.dest||{kind:"new"}};
      S.pending=null; el.remove(); finishGen(null);
    }
  });
}
function cleanPaste(t){
  t=t.replace(/\r/g,"").trim();
  // Gemini 앱이 붙이는 앞뒤 인사말·코드블록 정리
  t=t.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/,"");
  t=stripChatter(t);
  const lines=t.split("\n");
  const hi=lines.findIndex(l=>/^\s*#{1,3}\s*\S/.test(l));
  if(hi>0&&hi<=3&&lines.slice(0,hi).join("").length<200) t=lines.slice(hi).join("\n");
  return t;
}
function stripChatter(t){
  t=t.replace(/\r/g,"").trim();
  // 첫 문단이 짧은 응답 인사말이면 제거
  const firstPara=t.split(/\n\s*\n/)[0];
  const fp=firstPara.trim();
  if(fp.length<80&&!/^#/.test(fp)&&!/["“「『]/.test(fp)&&/^(네|넵|좋아요|알겠|물론)|요청하신|이어서|계속해서|이어 ?쓰|써 ?(드릴|볼)|작성해|소설입니다|이야기입니다/.test(fp)&&/(습니다|할게요|드릴게요|볼게요|쓸게요|갑니다|입니다)[.!~]*$/.test(fp)) t=t.slice(firstPara.length).trim();
  // 끝에 붙는 안내 문구 제거
  const paras=t.split(/\n\s*\n/); const last=paras[paras.length-1]||"";
  if(paras.length>1&&last.length<160&&/(원하시면|필요하시면|말씀해 주세요|말씀해주세요|알려주세요|도움이 되|이어서 써 드릴|다음 편)/.test(last)) t=paras.slice(0,-1).join("\n\n");
  return t;
}

/* ───────── 시작 ───────── */
(async()=>{
  const saved=await store.get();
  S={...structuredClone(DEFAULTS),...(saved||{})};
  S.reader={...DEFAULTS.reader,...S.reader}; if(S.reader.flow!=="scroll") S.reader.flow="page";
  for(const w of S.works){
    if(w.memo===undefined){
      const parts=[["등장인물",w.chars],["관계 · 호칭",w.relations],["세계관",w.world]].filter(([,v])=>(v||"").trim());
      w.memo=parts.map(([k,v])=>`[${k}]\n${v.trim()}`).join("\n\n");
      delete w.chars; delete w.relations; delete w.world;
    }
  }
  if(saved) save();
  if(!(S.words>=WMIN)) S.words=1500;
  if(!S.mode) S.mode=S.apiKey?"api":"app";
  if(!S.note&&((S.plotMemo||"").trim()||(S.plotSteps||[]).length)){
    const st=S.plotSteps||[];
    S.note=st.length>1?{divided:true,secs:st.map((x,i)=>newSec({title:x.k||"",ai:x.d||"",memo:i===0?(S.plotMemo||""):"",words:r100(S.words/st.length)}))}
      :{divided:false,secs:[newSec({memo:S.plotMemo||"",ai:st[0]?.d||"",words:S.words})]};
    S.plotMemo=""; S.plotSteps=[]; save();
  }
  applyTheme(); render();
  if(S.pending){ tab="write"; render(); openPending() }
  if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
})();
